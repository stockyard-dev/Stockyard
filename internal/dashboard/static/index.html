let _adminKey=sessionStorage.getItem('sy_admin_key')||'';
function setAdminKey(k){_adminKey=k;sessionStorage.setItem('sy_admin_key',k)}
let _teamScope=sessionStorage.getItem('sy_team_scope')||'';
function setTeamScope(id){_teamScope=id;if(id)sessionStorage.setItem('sy_team_scope',id);else sessionStorage.removeItem('sy_team_scope')}
function getTeamScope(){return _teamScope}
async function api(path,opts={}){
  const headers=opts.headers||{};
  if(_adminKey)headers['X-Admin-Key']=_adminKey;
  if(opts.body&&typeof opts.body==='string')headers['Content-Type']='application/json';
  let url=path;
  if(_teamScope&&(!opts.method||opts.method==='GET')){
    const sep=url.includes('?')?'&':'?';
    if(!url.includes('team_id='))url+=sep+'team_id='+_teamScope;
  }
  try{const r=await fetch(url,{...opts,headers});if(r.status===401||r.status===403)return{_error:r.status};if(!r.ok){const t=await r.text().catch(()=>'');try{return{_error:r.status,...JSON.parse(t)}}catch(e){return{_error:r.status,message:t}}}return await r.json()}catch(e){return{_error:e.message}}
}
const fmt={
  usd:v=>v==null?'\u2014':v<0.01&&v>0?'$'+v.toFixed(4):'$'+v.toFixed(2),
  num:v=>v==null?'\u2014':v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(1)+'K':String(v),
  ms:v=>v==null?'\u2014':v>=1000?(v/1000).toFixed(1)+'s':Math.round(v)+'ms',
  ago:ts=>{if(!ts)return'\u2014';const s=Math.floor((Date.now()-new Date(ts))/1000);if(s<60)return s+'s ago';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago'},
  trunc:(s,n=60)=>s&&s.length>n?s.substring(0,n)+'\u2026':s||'\u2014',
  hash:s=>s?s.substring(0,12)+'\u2026':'\u2014',
};

// ─── Shared Components ─────────────────────────────────────────────
function Stat({label,value,sub,accent}){return html`<div class="stat"><div class="stat-label">${label}</div><div class="stat-value ${accent?'accent':''}">${value}</div>${sub&&html`<div class="stat-sub">${sub}</div>`}</div>`}
function Badge({text,variant}){return html`<span class="badge ${variant||''}">${text}</span>`}
function TabBar({tabs,active,onChange}){return html`<div class="tab-bar">${tabs.map(t=>html`<button key=${t} class="tab ${active===t?'active':''}" onClick=${()=>onChange(t)}>${t}</button>`)}</div>`}
function Toast({msg,type,onDone}){useEffect(()=>{const t=setTimeout(onDone,3000);return()=>clearTimeout(t)},[]);return html`<div class="toast toast-${type||'info'}">${msg}</div>`}
function Btn({children,onClick,variant,disabled,small}){return html`<button class="btn ${variant||''} ${small?'btn-sm':''}" onClick=${onClick} disabled=${disabled}>${children}</button>`}
function Input({label,value,onChange,type,placeholder,mono}){return html`<div class="field">${label&&html`<label class="field-label">${label}</label>`}<input type=${type||'text'} value=${value} onInput=${e=>onChange(e.target.value)} class="field-input ${mono?'mono':''}" placeholder=${placeholder||''}/></div>`}
function Select({label,value,onChange,options}){return html`<div class="field">${label&&html`<label class="field-label">${label}</label>`}<select class="field-input" value=${value} onChange=${e=>onChange(e.target.value)}>${options.map(o=>html`<option key=${o.value||o} value=${o.value||o}>${o.label||o}</option>`)}</select></div>`}
function Modal({title,onClose,children}){return html`<div class="modal-overlay" onClick=${e=>{if(e.target===e.currentTarget)onClose()}}><div class="modal"><div class="modal-head"><span class="modal-title">${title}</span><button class="modal-close" onClick=${onClose}>\u2715</button></div><div class="modal-body">${children}</div></div></div>`}
function DataTable({columns,rows,emptyMsg,onRowClick}){
  if(!rows||rows.length===0)return html`<div class="empty-state">${emptyMsg||'No data yet.'}</div>`;
  const gc=columns.map(c=>c.width||'1fr').join(' ');
  return html`<div class="data-table"><div class="dt-head" style="grid-template-columns:${gc}">${columns.map(c=>html`<span key=${c.key}>${c.label}</span>`)}</div><div class="dt-body">${rows.map((row,i)=>html`<div key=${row.id||i} class="dt-row ${onRowClick?'dt-clickable':''}" style="grid-template-columns:${gc}" onClick=${()=>onRowClick&&onRowClick(row)}>${columns.map(c=>html`<span key=${c.key} class="${c.mono?'mono':''} ${c.accent?'dt-accent':''}">${c.render?c.render(row):row[c.key]||'\u2014'}</span>`)}</div>`)}</div></div>`;
}

function UpgradeBanner(){
  const[triggers,setTriggers]=useState([]);const[dismissed,setDismissed]=useState(()=>JSON.parse(sessionStorage.getItem('sy_dismissed_triggers')||'[]'));const[idx,setIdx]=useState(0);
  useEffect(()=>{(async()=>{const r=await api('/api/upgrade-prompts');if(r.triggers)setTriggers(r.triggers)})()},[]);
  const visible=triggers.filter(t=>!dismissed.includes(t.id));
  if(visible.length===0)return null;
  const t=visible[idx%visible.length]||visible[0];
  const dismiss=()=>{const d=[...dismissed,t.id];setDismissed(d);sessionStorage.setItem('sy_dismissed_triggers',JSON.stringify(d))};
  return html`<div class="upgrade-banner"><div class="upgrade-banner-inner"><span class="upgrade-badge">\u2191 Upgrade</span><strong>${t.title}</strong><span class="upgrade-msg">${t.message}</span><a href=${t.cta_link} class="upgrade-cta">${t.cta}</a><button class="upgrade-dismiss" onClick=${dismiss}>\u2715</button>${visible.length>1&&html`<button class="upgrade-next" onClick=${()=>setIdx(i=>i+1)}>\u203A</button>`}</div></div>`;
}

function provBadge(type){const m={native:{t:'Native',v:'success'},compat:{t:'Compat',v:''},local:{t:'Local',v:'warn'}};const b=m[type]||m.compat;return html`<${Badge} text=${b.t} variant=${b.v}/>`}
function provStatus(s){const m={ok:{icon:'\u2713',cls:'prov-ok'},healthy:{icon:'\u2713',cls:'prov-ok'},active:{icon:'\u2713',cls:'prov-ok'},unconfigured:{icon:'\u25CB',cls:'prov-unconfig'},unreachable:{icon:'\u2717',cls:'prov-err'},degraded:{icon:'\u26A0',cls:'prov-warn'}};const r=m[s]||{icon:'?',cls:'prov-unconfig'};return html`<span class="prov-status ${r.cls}">${r.icon}</span>`}

// ─── Provider panel component ──────────────────────────────────────
function ProviderPanel({provHealth,providerCount}){
  const[expanded,setExpanded]=useState(false);
  const[testing,setTesting]=useState(null);
  const testOne=async(name)=>{setTesting(name);try{await api('/api/proxy/providers/health')}catch(e){}setTesting(null)};
  const configured=provHealth?.providers?.filter(p=>p.status!=='unconfigured')||[];
  const unconfigured=provHealth?.providers?.filter(p=>p.status==='unconfigured')||[];
  const healthyCount=configured.filter(p=>p.status==='ok'||p.status==='healthy'||p.status==='active').length;
  if(!provHealth||!provHealth.providers)return null;
  return html`<div class="prov-panel">
    <div class="prov-panel-head" onClick=${()=>setExpanded(!expanded)}>
      <span class="prov-panel-title">\u25C8 Providers</span>
      <span class="prov-panel-summary">${configured.length} configured${healthyCount>0?' \u2022 '+healthyCount+' healthy':''} / 40 available</span>
      <span class="prov-panel-toggle">${expanded?'\u25B4':'\u25BE'}</span>
    </div>
    ${expanded?html`<div class="prov-panel-body">
      ${configured.length>0?html`<div class="prov-panel-section">
        <div class="prov-panel-section-title">Configured</div>
        ${configured.map(p=>{const meta=PROV_META[p.provider]||{type:'compat',env:'?'};return html`<div key=${p.provider} class="prov-row">
          ${provStatus(p.status)}
          <span class="prov-row-name mono">${p.provider}</span>
          ${provBadge(meta.type)}
          ${p.latency_ms>0?html`<span class="prov-row-latency mono">${p.latency_ms}ms</span>`:null}
          ${p.error?html`<span class="prov-row-error">${p.error.substring(0,60)}</span>`:null}
        </div>`})}
      </div>`:html`<div class="prov-panel-empty">No providers configured. Set an API key environment variable to get started.</div>`}
      ${unconfigured.length>0?html`<details class="prov-available">
        <summary class="prov-available-title">${40-configured.length} available providers</summary>
        <div class="prov-available-grid">${Object.entries(PROV_META).filter(([k])=>!configured.find(c=>c.provider===k)).map(([name,meta])=>html`<div key=${name} class="prov-avail-item">
          <span class="mono">${name}</span>
          ${provBadge(meta.type)}
          <span class="prov-avail-env mono">${meta.env}</span>
        </div>`)}</div>
      </details>`:null}
    </div>`:null}

}

// ─── Overview ──────────────────────────────────────────────────────
function OverviewView(){
  const[apps,setApps]=useState(null);const[users,setUsers]=useState([]);const[mods,setMods]=useState(0);
  const[platform,setPlatform]=useState(null);const[bus,setBus]=useState(null);const[relic,setRelic]=useState(null);const[crucible,setCrucible]=useState(null);const[costs,setCosts]=useState(null);
  const[provHealth,setProvHealth]=useState(null);
  const load=async()=>{
    const a=await api('/api/apps');setApps(a.apps||[]);
    const u=await api('/api/auth/users');setUsers(u.users||[]);
    const m=await api('/api/proxy/modules');setMods(m.count||0);
    const p=await api('/api/platform/health');if(!p._error)setPlatform(p);
    const b=await api('/api/platform/bus');if(!b._error)setBus(b);
    const r=await api('/relic/api/stats');if(!r._error)setRelic(r);
    const c=await api('/crucible/api/stats');if(!c._error)setCrucible(c);
    const co=await api('/api/observe/costs');if(!co._error)setCosts(co);
    const ph=await api('/api/proxy/providers/health');if(!ph._error)setProvHealth(ph);
  };
  useEffect(()=>{load();const i=setInterval(load,15000);return()=>clearInterval(i)},[]);
  if(!apps)return html`<div class="loading">Loading\u2026</div>`;
  const totalCost=costs?.providers?.reduce((s,p)=>s+(p.cost_usd||0),0)||0;
  const totalReqs=costs?.providers?.reduce((s,p)=>s+(p.requests||0),0)||0;
  const providerCount=costs?.providers?.length||0;
  const isFirstRun=totalReqs===0;
  const[testResult,setTestResult]=useState(null);const[testing,setTesting]=useState(false);
  const testConnection=async()=>{setTesting(true);setTestResult(null);try{const r=await api('/api/proxy/providers/health');const ok=!r._error&&r.providers?.some(p=>p.status==='active'||p.status==='ok'||p.reachable);setTestResult(ok?'ok':'fail')}catch(e){setTestResult('fail')}setTesting(false)};
  return html`<div class="page-head"><div class="page-eyebrow">Console</div><h2>System Overview</h2><p class="page-sub">${platform?platform.products+' products':apps.length+' apps'} \u2022 ${platform?.tier||'Community'} tier \u2022 ${platform?.status||'ok'}</p></div>
    <div class="stats-row">
      <${Stat} label="Products" value=${platform?.active||apps.length} sub=${platform?(platform.healthy+' healthy'):''} accent/>
      <${Stat} label="Requests" value=${fmt.num(totalReqs)} sub=${fmt.usd(totalCost)+' spent'}/>
      <${Stat} label="Modules" value=${mods}/>
      <${Stat} label="Providers" value=${providerCount} sub=${providerCount>0?'configured':'none yet'}/>
    </div>
    <${ProviderPanel} provHealth=${provHealth} providerCount=${providerCount}/>
    ${isFirstRun?html`<div class="first-run-checklist">
      <div class="frc-title">\u{1F680} Getting started</div>
      <div class="frc-item ${providerCount>0?'frc-done':''}"><span class="frc-check">${providerCount>0?'\u2713':'\u25CB'}</span><span>Set a provider key</span><code class="frc-code">export OPENAI_API_KEY=sk-...</code></div>
      <div class="frc-item ${testResult==='ok'?'frc-done':''}"><span class="frc-check">${testResult==='ok'?'\u2713':'\u25CB'}</span><span>Test your connection</span><button class="btn btn-sm ${testing?'':'primary'}" style="margin-left:8px" onClick=${testConnection} disabled=${testing||providerCount===0}>${testing?'Testing\u2026':testResult==='ok'?'\u2713 Connected':testResult==='fail'?'Retry':'Test connection'}</button>${testResult==='fail'?html`<span style="color:var(--red);font-size:0.78rem;margin-left:8px">Could not reach providers. Check your API keys.</span>`:null}</div>
      <div class="frc-item"><span class="frc-check">\u25CB</span><span>Send your first request</span><code class="frc-code">curl http://localhost:7749/v1/chat/completions -H "Content-Type: application/json" -H "Authorization: Bearer $OPENAI_API_KEY" -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"hello"}]}'</code></div>
      <div class="frc-item"><span class="frc-check">\u25CB</span><span>Point your app at the proxy</span><code class="frc-code">export OPENAI_BASE_URL=http://localhost:7749/v1</code></div>
      <div class="frc-hint">Once you send a request, this checklist disappears and your live dashboard takes over.</div>
    </div>`:null}
    ${relic||crucible?html`<div class="stats-row" style="margin-top:12px">
      ${relic?html`<${Stat} label="Relic Certs" value=${relic.total_certificates||0} sub=${'conf '+(relic.avg_confidence||0).toFixed(2)}/>`:null}
      ${crucible?html`<${Stat} label="Crucible Scores" value=${crucible.total_scores||0} sub=${'avg '+(crucible.avg_compound_score||0).toFixed(3)}/>`:null}
      <${Stat} label="Users" value=${users.length}/>
      <${Stat} label="Workflows" value="10" sub="chains active"/>
    </div>`:null}
    <div class="app-grid">${apps.map(a=>{const cfg=APPS[a.name];return html`<div key=${a.name} class="app-card"><div class="app-card-head"><span class="app-card-icon">${cfg?.icon||'\u25C6'}</span><span class="app-card-name">${a.name}</span><${Badge} text="live" variant="success"/></div><div class="app-card-desc">${a.description}</div><code class="app-card-api">${a.api}</code></div>`})}</div>`;
}

// ─── Config Diagnostics ────────────────────────────────────────────
function ConfigDiagnostics({providers,modules,aliases}){
  const checks=[];
  // Provider checks
  if(!providers||providers.length===0)checks.push({level:'warn',msg:'No providers configured. Set OPENAI_API_KEY or ANTHROPIC_API_KEY as environment variables.'});
  else checks.push({level:'ok',msg:providers.length+' provider'+(providers.length>1?'s':'')+' configured: '+providers.map(p=>p.name).join(', ')});
  const errProvs=providers?.filter(p=>p.error_count>0)||[];
  if(errProvs.length>0)checks.push({level:'warn',msg:'Provider errors detected: '+errProvs.map(p=>p.name+' ('+p.error_count+')').join(', ')});
  // Module checks
  const enabled=modules?.filter(m=>m.enabled)||[];
  if(enabled.length===0)checks.push({level:'info',msg:'No modules enabled. The proxy will forward requests without middleware processing.'});
  else checks.push({level:'ok',msg:enabled.length+' modules enabled.'});
  const hasFailover=enabled.some(m=>m.name==='failover');
  const hasCache=enabled.some(m=>m.name==='cachelayer'||m.name==='semanticcache');
  const hasCostcap=enabled.some(m=>m.name==='costcap');
  const hasRatelimit=enabled.some(m=>m.name==='rateshield');
  if(providers?.length>1&&!hasFailover)checks.push({level:'info',msg:'Multiple providers configured but failover is disabled. Enable the failover module for automatic provider fallback.'});
  if(!hasCache)checks.push({level:'info',msg:'Caching is disabled. Enable cachelayer to reduce costs on repeated prompts.'});
  if(!hasCostcap)checks.push({level:'info',msg:'No spending cap set. Enable costcap to prevent runaway costs.'});
  if(!hasRatelimit)checks.push({level:'info',msg:'Rate limiting is disabled. Enable rateshield to prevent request loops from draining your budget.'});
  // Alias checks
  if(aliases?.length>0)checks.push({level:'ok',msg:aliases.length+' alias'+(aliases.length>1?'es':'')+' configured.'});
  const icons={ok:'\u2713',warn:'\u26A0',info:'\u2139'};
  const colors={ok:'var(--green)',warn:'var(--gold)',info:'var(--cream-muted)'};
  return html`<div style="margin-top:8px">
    ${checks.map((c,i)=>html`<div key=${i} style="display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-bottom:1px solid var(--bg3)">
      <span style="color:${colors[c.level]};font-size:1rem;flex-shrink:0;width:20px;text-align:center">${icons[c.level]}</span>
      <span style="font-size:0.85rem;color:${c.level==='ok'?'var(--cream)':'var(--cream-dim)'}">${c.msg}</span>
    </div>`)}
    <div style="padding:16px 12px;font-size:0.78rem;color:var(--cream-muted);font-style:italic">Diagnostics check your current configuration for common issues. No external calls are made.</div>
  </div>`;
}

// ─── Proxy (Interactive toggles) ───────────────────────────────────
function ProxyView(){
  const[tab,setTab]=useState('modules');const[data,setData]=useState({});const[toast,setToast]=useState(null);const[filter,setFilter]=useState('');
  const[aliases,setAliases]=useState([]);const[newAlias,setNewAlias]=useState('');const[newModel,setNewModel]=useState('');
  const[rules,setRules]=useState([]);const[savings,setSavings]=useState(null);const[recommendations,setRecs]=useState([]);
  const[showAddRule,setShowAddRule]=useState(false);const[editRule,setEditRule]=useState(null);
  const[ruleForm,setRuleForm]=useState({name:'',priority:10,condField:'model',condOp:'==',condValue:'',actionModel:'',enabled:true});
  const load=async()=>{const[m,p,r]=await Promise.all([api('/api/proxy/modules'),api('/api/proxy/providers'),api('/api/proxy/routes')]);setData({modules:m.modules||[],providers:p.providers||[],routes:r.routes||[]})};
  const loadAliases=async()=>{const r=await api('/api/proxy/aliases');setAliases(r.aliases||[])};
  const loadRouting=async()=>{const[r,s,o]=await Promise.all([api('/api/proxy/routing/rules'),api('/api/proxy/routing/savings'),api('/api/proxy/routing/optimize')]);setRules(r.rules||[]);setSavings(s);setRecs(o.recommendations||[])};
  useEffect(()=>{load();loadAliases();loadRouting()},[]);
  const toggleModule=async(name,enabled)=>{const r=await api('/api/proxy/modules/'+name,{method:'PUT',body:JSON.stringify({enabled:!enabled})});if(r._error){setToast({msg:'Failed: '+name,type:'error'});return}setToast({msg:name+' '+(enabled?'disabled':'enabled'),type:'success'});load()};
  const bulkToggle=async(cat,enabled)=>{const body=cat==='all'?{modules:d('modules').map(m=>m.name),enabled}:{category:cat,enabled};const r=await api('/api/proxy/modules/bulk',{method:'POST',body:JSON.stringify(body)});if(r._error){setToast({msg:'Bulk toggle failed',type:'error'});return}setToast({msg:(r.affected||0)+' modules '+(enabled?'enabled':'disabled'),type:'success'});load()};
  const saveRule=async()=>{const body={name:ruleForm.name,priority:ruleForm.priority,condition:{field:ruleForm.condField,op:ruleForm.condOp,value:ruleForm.condValue},action:{route_to_model:ruleForm.actionModel},enabled:ruleForm.enabled};
    if(editRule){const r=await api('/api/proxy/routing/rules/'+editRule,{method:'PUT',body:JSON.stringify(body)});if(r._error){setToast({msg:'Update failed',type:'error'});return}setToast({msg:'Rule updated',type:'success'})}

// ─── Chart Components ──────────────────────────────────────────────
function Sparkline({data,width=200,height=40,color='var(--rust-light)',fill=true}){
  if(!data||data.length<2)return html`<svg width=${width} height=${height}><text x=${width/2} y=${height/2+4} text-anchor="middle" fill="var(--cream-muted)" font-size="10" font-family="var(--font-mono)">No data</text></svg>`;
  const max=Math.max(...data,0.001);const min=Math.min(...data,0);const range=max-min||1;
  const pts=data.map((v,i)=>[i/(data.length-1)*width,(1-(v-min)/range)*(height-4)+2]);
  const line=pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area=line+' L'+width+','+height+' L0,'+height+' Z';
  return html`<svg width=${width} height=${height} style="display:block">${fill&&html`<path d=${area} fill=${color} opacity="0.1"/>`}<path d=${line} fill="none" stroke=${color} stroke-width="1.5"/><circle cx=${pts[pts.length-1][0]} cy=${pts[pts.length-1][1]} r="2.5" fill=${color}/></svg>`;
}
function MiniBar({items,width=260,height=120}){
  if(!items||items.length===0)return html`<div class="empty-state" style="padding:16px;font-size:0.78rem">No data.</div>`;
  const max=Math.max(...items.map(i=>i.value),0.001);const barH=Math.min(18,Math.floor((height-8)/items.length)-4);
  return html`<svg width=${width} height=${items.length*(barH+6)+4} style="display:block">${items.map((item,i)=>{
    const w=Math.max(2,(item.value/max)*(width-90));const y=i*(barH+6)+2;
    return html`<g key=${i}><rect x="80" y=${y} width=${w} height=${barH} fill=${item.color||'var(--rust)'} rx="2" opacity="0.8"/><text x="76" y=${y+barH/2+4} text-anchor="end" fill="var(--cream-dim)" font-size="10" font-family="var(--font-mono)">${item.label}</text><text x=${82+w} y=${y+barH/2+4} fill="var(--cream-muted)" font-size="9" font-family="var(--font-mono)">${item.display||item.value.toFixed(2)}</text></g>`;
  })}</svg>`;
}

      <div class="safety-score-card">
        <div class="safety-score-ring" style="--score-color:${scoreColor(sf.safety_score||100)}">
          <div class="safety-score-num" style="color:${scoreColor(sf.safety_score||100)}">${sf.safety_score!=null?sf.safety_score:100}</div>

          <div class="section-title" style="margin-bottom:8px">Active Defenses</div>

          {key:'type',label:'Event',width:'140px',mono:true,render:r=>html`<span style="color:${r.severity==='critical'?'var(--red)':r.severity==='high'?'var(--rust-light)':'var(--cream-muted)'}">${r.event_type}</span>`},

// ─── Studio ────────────────────────────────────────────────────────
function StudioView(){
  const[tab,setTab]=useState('playground');const[data,setData]=useState({});const[toast,setToast]=useState(null);

  const[prompt,setPrompt]=useState('');const[system,setSystem]=useState('');const[models,setModels]=useState(['gpt-4o-mini']);
  const[running,setRunning]=useState(false);const[pgResult,setPgResult]=useState(null);const[compareMode,setCompareMode]=useState(false);
  const[expResult,setExpResult]=useState(null);const[selExp,setSelExp]=useState(null);
  const MODEL_LIST=['gpt-4o-mini','gpt-4o','gpt-4.1-mini','gpt-4.1','claude-sonnet-4-5-20250929','claude-haiku-4-5-20251001','gemini-2.5-flash','deepseek-chat','mistral-small-latest','llama-3.3-70b-versatile'];
  const load=async()=>{const[t,e,b]=await Promise.all([api('/api/studio/templates'),api('/api/studio/experiments'),api('/api/studio/benchmarks')]);setData({templates:t.templates||[],experiments:e.experiments||[],benchmarks:b.benchmarks||[]})};
  useEffect(()=>{load()},[]);
  const d=k=>Array.isArray(data[k])?data[k]:[];
  const runPlayground=async()=>{
    if(!prompt.trim())return;setRunning(true);setPgResult(null);setExpResult(null);
    if(compareMode&&models.length>=2){
      const r=await api('/api/studio/experiments/run',{method:'POST',body:JSON.stringify({name:'playground-'+Date.now(),prompt,system,models,runs:1,eval:'length'})});
      setRunning(false);if(r._error||r.error){setToast({msg:r.error||r._error,type:'error'});return}setExpResult(r);load();
    }else{
      const r=await api('/api/studio/playground',{method:'POST',body:JSON.stringify({prompt,system,model:models[0]})});
      setRunning(false);if(r._error){setToast({msg:r.error||r._error,type:'error'});return}setPgResult(r);
    }
  };
  const loadTemplate=async(slug)=>{const t=await api('/api/studio/templates/'+slug);if(!t._error){setPrompt(t.content||'');if(t.model)setModels([t.model]);setSystem('');setTab('playground');setToast({msg:'Loaded: '+t.name,type:'success'})}};
  const toggleModel=(m)=>{if(models.includes(m)){if(models.length>1)setModels(models.filter(x=>x!==m))}else{setModels([...models,m])}};
  const viewExp=async(id)=>{const r=await api('/api/studio/experiments/'+id);if(!r._error)setSelExp(r)};
  return html`<div class="page-head"><div class="page-eyebrow">Studio</div><h2>Prompt Playground</h2><p class="page-sub">Test prompts, compare models side-by-side, run experiments.</p></div>
    <div class="stats-row"><${Stat} label="Templates" value=${d('templates').length} accent/><${Stat} label="Experiments" value=${d('experiments').length}/><${Stat} label="Benchmarks" value=${d('benchmarks').length}/></div>
    <${TabBar} tabs=${['playground','templates','experiments','benchmarks']} active=${tab} onChange=${setTab}/>
    ${tab==='playground'?html`<div class="pg-layout">
      <div class="pg-input">
        <div class="section-title" style="margin-bottom:6px">System Message <span style="color:var(--cream-muted);font-weight:400;font-size:0.72rem">(optional)</span></div>
        <textarea class="field-input mono" rows="2" placeholder="You are a helpful assistant..." value=${system} onInput=${e=>setSystem(e.target.value)} style="resize:vertical;font-size:0.78rem;margin-bottom:10px"/>
        <div class="section-title" style="margin-bottom:6px">Prompt</div>
        <textarea class="field-input mono" rows="5" placeholder="Type your prompt here..." value=${prompt} onInput=${e=>setPrompt(e.target.value)} style="resize:vertical;font-size:0.78rem;margin-bottom:10px"/>
        <div class="section-title" style="margin-bottom:6px;display:flex;align-items:center;gap:8px">
          Models
          <label style="font-size:0.72rem;color:var(--cream-muted);display:flex;align-items:center;gap:4px;cursor:pointer;font-weight:400">
            <input type="checkbox" checked=${compareMode} onChange=${e=>setCompareMode(e.target.checked)} style="accent-color:var(--rust-light)"/>
            Compare mode
          </label>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
          ${MODEL_LIST.map(m=>html`<button key=${m} class="btn btn-sm ${models.includes(m)?'primary':''}" 
            onClick=${()=>compareMode?toggleModel(m):setModels([m])}
            style="font-size:0.72rem;font-family:var(--font-mono);padding:3px 8px;${models.includes(m)?'':'opacity:0.6'}">${m}</button>`)}
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <${Btn} variant="primary" onClick=${runPlayground} disabled=${running||!prompt.trim()}>${running?(compareMode?'Comparing\u2026':'Running\u2026'):(compareMode?'Compare '+models.length+' Models':'Run')}<//>
          ${models.length<2&&compareMode?html`<span style="font-size:0.72rem;color:var(--cream-muted)">Select 2+ models to compare</span>`:''}
        </div>
      </div>
      <div class="pg-output">
        ${pgResult?html`<div class="pg-result-card">
          <div class="pg-result-head">
            <span class="mono" style="font-weight:600">${pgResult.model}</span>
            <span class="mono" style="font-size:0.72rem;color:var(--cream-muted)">${fmt.ms(pgResult.latency_ms)}</span>
            <span class="mono" style="font-size:0.72rem;color:var(--cream-muted)">${pgResult.tokens_in||0}\u2192${pgResult.tokens_out||0} tok</span>
            <span class="mono" style="font-size:0.72rem;color:var(--green)">$${(pgResult.cost_usd||0).toFixed(4)}</span>
          </div>
          ${pgResult.error?html`<div style="color:var(--red);font-size:0.82rem;padding:8px">${pgResult.error}</div>`
           :html`<div class="pg-result-body">${pgResult.content||'(empty response)'}</div>`}
        </div>`:
        expResult?html`<div class="pg-compare">
          ${(expResult.variants||[]).map(v=>html`<div key=${v.model} class="pg-result-card ${v.model===expResult.winner?'pg-winner':''}">
            <div class="pg-result-head">
              <span class="mono" style="font-weight:600">${v.model}</span>
              ${v.model===expResult.winner?html`<${Badge} text="winner" variant="success"/>`:null}
            </div>
            <div style="display:flex;gap:12px;padding:6px 10px;font-size:0.72rem;font-family:var(--font-mono);color:var(--cream-muted);border-bottom:1px solid var(--bg3)">
              <span>${fmt.ms(v.avg_latency_ms)}</span>
              <span>${v.avg_tokens_in||0}\u2192${v.avg_tokens_out||0} tok</span>
              <span style="color:var(--green)">$${(v.avg_cost_usd||0).toFixed(4)}</span>
              ${v.errors>0?html`<span style="color:var(--red)">${v.errors} errors</span>`:null}
            </div>
            ${v.runs&&v.runs[0]?html`<div class="pg-result-body">${v.runs[0].error?html`<span style="color:var(--red)">${v.runs[0].error}</span>`:v.runs[0].content||'(empty)'}</div>`:null}
          </div>`)}
          <div style="padding:8px;font-size:0.78rem;color:var(--cream-muted);text-align:center">
            Winner: <span class="mono" style="color:var(--green)">${expResult.winner||'none'}</span> by ${expResult.win_reason||'eval'} \u2014
            Total: $${(expResult.total_cost_usd||0).toFixed(4)} in ${fmt.ms(expResult.duration_ms)}
            ${expResult.experiment_id?html` \u2014 <span class="mono">exp #${expResult.experiment_id}</span>`:''}
          </div>
        </div>`:
        html`<div style="color:var(--cream-muted);text-align:center;padding:40px;font-size:0.85rem">
          <div style="font-size:1.5rem;margin-bottom:10px">\u26A1</div>
          <div>Type a prompt and hit Run to test it through the proxy.</div>
          <div style="margin-top:6px;font-size:0.78rem">Enable <strong>Compare mode</strong> to test multiple models side-by-side.</div>
          <div style="margin-top:6px;font-size:0.72rem;color:var(--cream-muted)">Requires API keys configured (OPENAI_API_KEY, etc.)</div>
        </div>`}
      </div>
    </div>`:
    tab==='templates'?html`<div class="pack-grid">${d('templates').map(t=>html`<div key=${t.slug} class="pack-card" style="cursor:pointer" onClick=${()=>loadTemplate(t.slug)}>
      <div class="pack-name">${t.name||t.slug}</div>
      <div class="pack-desc">${t.description||'\u2014'}</div>
      <div class="pack-meta"><span class="mono">${t.slug}</span>${t.model?html`<span class="mono">${t.model}</span>`:null}<span class="mono">v${t.current_version||1}</span></div>
      <div style="margin-top:6px"><${Btn} small onClick=${e=>{e.stopPropagation();loadTemplate(t.slug)}}>Load in Playground<//></div>
    </div>`)}</div>${d('templates').length===0?html`<div class="empty-state">No templates. Install the Dev Productivity pack to get starter templates.</div>`:''}`:
    tab==='experiments'?html`<${DataTable} columns=${[
      {key:'name',label:'Experiment',width:'1.5fr',mono:true},
      {key:'status',label:'Status',width:'100px',render:r=>html`<${Badge} text=${r.status||'draft'} variant=${r.status==='completed'?'success':r.status==='running'?'warn':'muted'}/>`},
      {key:'type',label:'Type',width:'100px',mono:true},
      {key:'ts',label:'Created',width:'110px',render:r=>fmt.ago(r.created_at)}
    ]} rows=${d('experiments')} onRowClick=${r=>viewExp(r.id)} emptyMsg="No experiments yet \u2014 run a comparison in the playground."/>`:
    html`<${DataTable} columns=${[{key:'name',label:'Benchmark',width:'1.5fr'},{key:'status',label:'Status',width:'100px',render:r=>html`<${Badge} text=${r.status||'pending'} variant=${r.status==='completed'?'success':'muted'}/>`},{key:'ts',label:'Created',width:'110px',render:r=>fmt.ago(r.created_at)}]} rows=${d('benchmarks')} emptyMsg="No benchmarks."/>`}
    ${selExp&&html`<${Modal} title=${'Experiment: '+(selExp.name||'#'+selExp.id)} onClose=${()=>setSelExp(null)}>
      <div class="trace-detail">
        <div class="td-row"><span class="td-label">Status</span><${Badge} text=${selExp.status} variant=${selExp.status==='completed'?'success':'muted'}/></div>
        <div class="td-row"><span class="td-label">Type</span><span class="mono">${selExp.type}</span></div>

        ${selExp.results?.variants?html`<div class="td-section"><div class="td-label">Results</div>
          ${selExp.results.variants.map(v=>html`<div key=${v.model} style="padding:6px 0;border-bottom:1px solid var(--bg2)">
            <div style="display:flex;gap:8px;align-items:center">
              <span class="mono" style="font-weight:600">${v.model}</span>
              ${v.model===selExp.results?.winner?html`<${Badge} text="winner" variant="success"/>`:null}
              <span class="mono" style="font-size:0.72rem;color:var(--cream-muted)">${fmt.ms(v.avg_latency_ms)} \u2014 $${(v.avg_cost_usd||0).toFixed(4)}</span>
            </div>
            ${v.runs&&v.runs[0]?html`<pre class="td-pre" style="max-height:100px;margin-top:4px">${fmt.trunc(v.runs[0].content||v.runs[0].error||'',300)}</pre>`:null}
          </div>`)}

      </div>
    <//>`}
    ${toast&&html`<${Toast} msg=${toast.msg} type=${toast.type} onDone=${()=>setToast(null)}/>`}`
}

// ─── Forge ─────────────────────────────────────────────────────────
function ForgeView(){
  const[tab,setTab]=useState('workflows');const[data,setData]=useState({});const[toast,setToast]=useState(null);
  const[selWf,setSelWf]=useState(null);const[selRun,setSelRun]=useState(null);const[runInput,setRunInput]=useState('');const[running,setRunning]=useState(null);
  const load=async()=>{const[w,r,t]=await Promise.all([api('/api/forge/workflows'),api('/api/forge/runs'),api('/api/forge/tools')]);setData({workflows:w.workflows||[],runs:r.runs||[],tools:t.tools||[]})};
  useEffect(()=>{load()},[]);
  const viewWorkflow=async slug=>{const r=await api('/api/forge/workflows/'+slug);if(!r._error)setSelWf(r)};
  const runWorkflow=async slug=>{setRunning(slug);const inp=runInput||'Hello, test this workflow';const r=await api('/api/forge/workflows/'+slug+'/run',{method:'POST',body:JSON.stringify({input:inp})});setRunning(null);if(r._error){setToast({msg:'Failed: '+(r.error||r._error),type:'error'});return}setToast({msg:'Run started: '+r.run_id,type:'success'});setRunInput('');setSelWf(null);setTimeout(load,2000);setTimeout(load,5000)};
  const viewRun=async id=>{const[r,s]=await Promise.all([api('/api/forge/runs/'+id),api('/api/forge/runs/'+id+'/steps')]);if(!r._error){r._stepLogs=s.steps||[];setSelRun(r)}};
  const refreshRun=async()=>{if(!selRun)return;const[r,s]=await Promise.all([api('/api/forge/runs/'+selRun.id),api('/api/forge/runs/'+selRun.id+'/steps')]);if(!r._error){r._stepLogs=s.steps||[];setSelRun(r)}};
  useEffect(()=>{if(selRun&&(selRun.status==='running'||selRun.status==='pending')){const t=setInterval(()=>{refreshRun();load()},2000);return()=>clearInterval(t)}},[selRun?.id,selRun?.status]);
  const d=k=>Array.isArray(data[k])?data[k]:[];
  const STEP_COLORS={'llm':'var(--rust-light)','transform':'var(--gold)','tool':'var(--green)','http':'var(--leather-light)','gate':'var(--amber)'};
  return html`<div class="page-head"><div class="page-eyebrow">Forge</div><h2>Workflow Engine</h2><p class="page-sub">DAG workflows, tools & runs. 5 step types: LLM, transform, tool, HTTP, gate.</p></div>
    <div class="stats-row"><${Stat} label="Workflows" value=${d('workflows').length} accent/><${Stat} label="Runs" value=${d('runs').length} sub=${d('runs').filter(r=>r.status==='success').length+' succeeded'}/><${Stat} label="Tools" value=${d('tools').length}/></div>
    <${TabBar} tabs=${['workflows','runs','tools']} active=${tab} onChange=${setTab}/>
    ${tab==='workflows'?html`<div class="wf-grid">${d('workflows').map(w=>html`<div key=${w.slug} class="wf-card" onClick=${()=>viewWorkflow(w.slug)}>
      <div class="wf-card-head"><span class="wf-card-name">${w.name}</span><${Badge} text=${w.enabled!==false?'active':'off'} variant=${w.enabled!==false?'success':'muted'}/></div>
      <div class="wf-card-desc">${w.description||'\u2014'}</div>
      <div class="wf-card-meta"><span class="mono">${w.slug}</span><span class="mono">${w.step_count||0} steps</span><span class="mono">${w.trigger_type||'manual'}</span></div>
    </div>`)}</div>${d('workflows').length===0&&html`<div class="empty-state">No workflows. Install the Eval Suite pack or create one via API.</div>`}`:
    tab==='runs'?html`<${DataTable} columns=${[
      {key:'id',label:'Run',width:'140px',mono:true,render:r=>fmt.trunc(r.id,18)},
      {key:'wf',label:'Workflow',width:'120px',mono:true,render:r=>r.workflow_slug||'#'+r.workflow_id},
      {key:'status',label:'Status',width:'100px',render:r=>html`<${Badge} text=${r.status||'pending'} variant=${r.status==='success'?'success':r.status==='running'?'warn':r.status==='failed'?'danger':'muted'}/>`},
      {key:'progress',label:'Progress',width:'80px',mono:true,render:r=>(r.steps_completed||0)+'/'+(r.steps_total||0)},
      {key:'ts',label:'Started',width:'100px',render:r=>fmt.ago(r.started_at||r.created_at)},
      {key:'done',label:'Duration',width:'100px',mono:true,render:r=>{if(!r.completed_at||!r.started_at)return r.status==='running'?'running\u2026':'\u2014';const ms=new Date(r.completed_at)-new Date(r.started_at);return fmt.ms(ms)}}
    ]} rows=${d('runs')} onRowClick=${r=>viewRun(r.id)} emptyMsg="No runs yet \u2014 run a workflow to see results here."/>`:
    html`<${DataTable} columns=${[
      {key:'name',label:'Tool',width:'1.2fr',mono:true},
      {key:'type',label:'Type',width:'100px',render:r=>html`<${Badge} text=${r.type||'function'} variant=${r.type==='builtin'?'success':'muted'}/>`},
      {key:'desc',label:'Description',width:'2fr',render:r=>r.description||'\u2014'},
      {key:'enabled',label:'Status',width:'80px',render:r=>html`<${Badge} text=${r.enabled?'on':'off'} variant=${r.enabled?'success':'muted'}/>`}
    ]} rows=${d('tools')} emptyMsg="No tools. Tools will be seeded on next deploy."/>`}
    ${selWf&&html`<${Modal} title=${selWf.name||selWf.slug} onClose=${()=>setSelWf(null)}>

        <div style="display:flex;gap:8px;justify-content:flex-end">

        </div>
      </div>
    <//>`}

      <div class="wf-detail">
        <div class="td-row"><span class="td-label">Status</span><span><${Badge} text=${selRun.status} variant=${selRun.status==='success'?'success':selRun.status==='failed'?'danger':'warn'}/>${(selRun.status==='running'||selRun.status==='pending')?html` <${Btn} small onClick=${refreshRun}>\u21BB Refresh<//>`:''}</span></div>
        <div class="td-row"><span class="td-label">Workflow</span><span class="mono">${selRun.workflow_slug||'#'+selRun.workflow_id}</span></div>

        ${(selRun._stepLogs&&selRun._stepLogs.length>0)?html`<div class="td-section"><div class="td-label">Step Execution Log</div>
          ${selRun._stepLogs.map((s,i)=>html`<div key=${s.step_id||i} class="run-step-result">
            <div class="run-step-head">
              <span class="wf-step-badge" style="background:${STEP_COLORS[s.step_type]||'var(--cream-muted)'}20;color:${STEP_COLORS[s.step_type]||'var(--cream-muted)'}">${s.step_type||'llm'}</span>

              ${s.latency_ms?html`<span class="mono" style="font-size:0.7rem;color:var(--cream-muted)">${fmt.ms(s.latency_ms)}</span>`:''}
            </div>
            ${s.tokens_in||s.tokens_out?html`<div style="font-family:var(--font-mono);font-size:0.7rem;color:var(--cream-muted);margin:4px 0">${s.tokens_in||0} in / ${s.tokens_out||0} out</div>`:''}

// ─── Exchange (with install/uninstall) ─────────────────────────────

// ─── Settings (Users, API Keys, Provider Keys) ─────────────────────
function SettingsView(){
  const[users,setUsers]=useState([]);const[sel,setSel]=useState(null);const[keys,setKeys]=useState([]);const[provs,setProvs]=useState([]);
  const[toast,setToast]=useState(null);const[showNew,setShowNew]=useState(false);const[newEmail,setNewEmail]=useState('');const[newName,setNewName]=useState('');
  const[newKey,setNewKey]=useState(null);const[showProv,setShowProv]=useState(false);const[pn,setPn]=useState('openai');const[pk,setPk]=useState('');const[pu,setPu]=useState('');
  const loadUsers=async()=>{const r=await api('/api/auth/users');setUsers(r.users||[])};
  useEffect(()=>{loadUsers()},[]);

  const createUser=async()=>{const r=await api('/api/auth/users',{method:'POST',body:JSON.stringify({email:newEmail,name:newName})});if(r._error){setToast({msg:'Error: '+(r.error||r._error),type:'error'});return}setNewKey(r.api_key);setShowNew(false);setNewEmail('');setNewName('');setToast({msg:'User created!',type:'success'});loadUsers()};
  const genKey=async()=>{if(!sel)return;const r=await api('/api/auth/users/'+sel.id+'/keys',{method:'POST',body:JSON.stringify({name:'key-'+(keys.length+1)})});if(r._error){setToast({msg:'Error',type:'error'});return}setNewKey(r);setToast({msg:'Key created!',type:'success'});selectUser(sel)};
  const revoke=async kid=>{if(!sel)return;await api('/api/auth/users/'+sel.id+'/keys/'+kid,{method:'DELETE'});setToast({msg:'Revoked',type:'success'});selectUser(sel)};
  const addProv=async()=>{if(!sel||!pk)return;await api('/api/auth/users/'+sel.id+'/providers/'+pn,{method:'PUT',body:JSON.stringify({api_key:pk,base_url:pu})});setToast({msg:pn+' saved',type:'success'});setShowProv(false);setPk('');setPu('');selectUser(sel)};

      <div class="settings-main">

    <div style="margin-top:32px;border-top:1px solid var(--bg3);padding-top:24px">
      <div class="section-title">Quick Reference</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px">

        <div style="background:var(--bg2);border:1px solid var(--bg3);padding:16px">
          <div style="font-size:0.78rem;color:var(--rust-light);font-weight:600;margin-bottom:8px">Backup</div>

          <code class="mono" style="font-size:0.72rem;display:block;margin-top:6px;color:var(--leather-light)">cp /data/stockyard.db backup.db</code>
        </div>
      </div>
    </div>
    ${toast&&html`<${Toast} msg=${toast.msg} type=${toast.type} onDone=${()=>setToast(null)}/>`}`;
}

  const deleteTeam=async()=>{if(!sel||!confirm('Delete team "'+sel.name+'"? All team keys will be revoked.'))return;
    await api('/api/teams/'+sel.id,{method:'DELETE'});setSel(null);setKeys([]);setSpend(null);
    setToast({msg:'Team deleted',type:'success'});loadTeams()};
  const updateTeam=async()=>{if(!sel)return;const body={};if(editName)body.name=editName;if(editDesc!==undefined)body.description=editDesc;
    const r=await api('/api/teams/'+sel.id,{method:'PUT',body:JSON.stringify(body)});
    if(r._error||r.error){setToast({msg:'Error: '+(r.error||r._error),type:'error'});return}
    setShowEdit(false);setToast({msg:'Team updated',type:'success'});loadTeams();selectTeam(r)};
  const genKey=async()=>{if(!sel)return;const name=keyName||'key-'+(keys.length+1);
    const r=await api('/api/teams/'+sel.id+'/keys',{method:'POST',body:JSON.stringify({name})});
    if(r._error||r.error){setToast({msg:'Error: '+(r.error||r._error),type:'error'});return}
    setNewKey(r);setShowNewKey(false);setKeyName('');setToast({msg:'Key created!',type:'success'});selectTeam(sel)};
  const revoke=async kid=>{if(!sel||!confirm('Revoke this key?'))return;
    await api('/api/teams/'+sel.id+'/keys/'+kid,{method:'DELETE'});setToast({msg:'Revoked',type:'success'});selectTeam(sel)};
  const rotate=async kid=>{if(!sel||!confirm('Rotate this key? The old key will stop working immediately.'))return;
    const r=await api('/api/teams/'+sel.id+'/keys/'+kid+'/rotate',{method:'POST'});
    if(r.new_key)setNewKey(r.new_key);setToast({msg:'Key rotated',type:'success'});selectTeam(sel)};
  const fmtCost=v=>v!=null?'$'+v.toFixed(4):'$0.00';
  return html`<div class="page-head"><div class="page-eyebrow">Teams</div><h2>Team Key Isolation</h2><p class="page-sub">Create teams with separate API keys. Requests are isolated in logs, metrics, and spend tracking.</p></div>
    <div class="stats-row">
      <${Stat} label="Teams" value=${teams.length} accent/>
      <${Stat} label="Selected" value=${sel?sel.name:'None'}/>
      <${Stat} label="Team Keys" value=${sel?keys.length:'\u2014'}/>
      <${Stat} label="Team Spend (Month)" value=${spend?fmtCost(spend.this_month?.cost_usd):'\u2014'}/>
    </div>
    <div class="settings-layout">
      <div class="settings-sidebar"><div class="settings-sidebar-head"><span>Teams</span><${Btn} small variant="primary" onClick=${()=>setShowNew(true)}>+ New<//></div>
        <div class="user-list">${teams.map(t=>html`<div key=${t.id} class="user-item ${sel?.id===t.id?'active':''}" onClick=${()=>selectTeam(t)}>
          <div class="user-email">${t.name}</div>
          <div class="user-meta">${t.slug} \u00B7 ${fmt.ago(t.created_at)}</div>
        </div>`)}
        ${teams.length===0&&html`<div class="empty-state" style="padding:24px;font-size:0.8rem">No teams yet. Create one to get started.</div>`}</div></div>
      <div class="settings-main">
        ${!sel?html`<div class="empty-state">Select a team to manage keys and view usage.</div>`:html`
          <div class="section-head" style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
            <h3 style="margin:0">${sel.name}</h3>
            <${Badge} text=${sel.slug} variant="muted"/>
            <div style="margin-left:auto;display:flex;gap:8px">
              <${Btn} small onClick=${()=>{setEditName(sel.name);setEditDesc(sel.description);setShowEdit(true)}}>Edit<//>
              <${Btn} small variant="danger" onClick=${deleteTeam}>Delete<//>
            </div>
          </div>
          ${sel.description&&html`<p style="color:var(--cream-dim);font-size:0.85rem;margin-bottom:16px">${sel.description}</p>`}

          ${spend&&html`<div class="stats-row" style="margin-bottom:20px">
            <${Stat} label="Today" value=${fmtCost(spend.today?.cost_usd)} sub=${(spend.today?.requests||0)+' reqs'}/>
            <${Stat} label="This Month" value=${fmtCost(spend.this_month?.cost_usd)} sub=${(spend.this_month?.requests||0)+' reqs'}/>
            <${Stat} label="All Time" value=${fmtCost(spend.total?.cost_usd)} sub=${(spend.total?.requests||0)+' reqs'}/>
            <${Stat} label="Total Tokens" value=${fmt.num((spend.total?.tokens_in||0)+(spend.total?.tokens_out||0))}/>
          </div>`}

          <div class="section-title">API Keys <${Btn} small onClick=${()=>setShowNewKey(true)}>+ Generate<//></div>
          ${newKey&&html`<div class="key-alert"><div class="key-alert-title">New API Key (copy now \u2014 shown once)</div><code class="key-alert-value">${newKey.key||newKey}</code>
            <${Btn} small onClick=${()=>{navigator.clipboard.writeText(newKey.key||newKey);setToast({msg:'Copied!',type:'success'})}}>Copy<//>
          </div>`}
          <${DataTable} columns=${[
            {key:'name',label:'Name',width:'1fr',mono:true},
            {key:'key_prefix',label:'Key',width:'1.5fr',mono:true},
            {key:'last_used',label:'Last Used',width:'100px',render:r=>fmt.ago(r.last_used)},
            {key:'a',label:'',width:'140px',render:r=>html`<div style="display:flex;gap:4px">
              <${Btn} small onClick=${()=>rotate(r.id)}>Rotate<//>
              <${Btn} small variant="danger" onClick=${()=>revoke(r.id)}>Revoke<//></div>`}
          ]} rows=${keys} emptyMsg="No API keys. Generate one to start isolating requests."/>

          <div class="section-title" style="margin-top:24px">Quick Start</div>
          <div style="background:var(--bg2);border:1px solid var(--bg3);padding:16px;margin-top:8px">
            <div style="font-size:0.78rem;color:var(--cream-dim);margin-bottom:8px">Use a team key just like a regular Stockyard key. Requests will be automatically attributed to this team.</div>
            <pre style="font-family:var(--font-mono);font-size:0.72rem;color:var(--leather-light);white-space:pre-wrap;margin:0">curl ${window.location.origin}/v1/chat/completions \\
  -H "Authorization: Bearer sk-sy-YOUR_TEAM_KEY" \\
  -H "Content-Type: application/json" \\
  -d '{"model":"gpt-4o","messages":[{"role":"user","content":"Hello"}]}'</pre>
          </div>
        `}
      </div>
    </div>
    ${showNew&&html`<${Modal} title="Create Team" onClose=${()=>setShowNew(false)}>
      <${Input} label="Team Name" value=${newName} onChange=${setNewName} placeholder="e.g. Frontend, Backend, ML"/>
      <${Input} label="Description (optional)" value=${newDesc} onChange=${setNewDesc} placeholder="What this team is for"/>
      <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end">
        <${Btn} onClick=${()=>setShowNew(false)}>Cancel<//>
        <${Btn} variant="primary" onClick=${createTeam} disabled=${!newName}>Create Team<//>
      </div>
    <//>`}
    ${showNewKey&&html`<${Modal} title="Generate Team Key" onClose=${()=>setShowNewKey(false)}>
      <${Input} label="Key Name" value=${keyName} onChange=${setKeyName} placeholder="e.g. production, staging, ci"/>
      <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end">
        <${Btn} onClick=${()=>setShowNewKey(false)}>Cancel<//>
        <${Btn} variant="primary" onClick=${genKey}>Generate Key<//>
      </div>
    <//>`}
    ${showEdit&&html`<${Modal} title="Edit Team" onClose=${()=>setShowEdit(false)}>
      <${Input} label="Team Name" value=${editName} onChange=${setEditName}/>
      <${Input} label="Description" value=${editDesc} onChange=${setEditDesc}/>
      <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end">
        <${Btn} onClick=${()=>setShowEdit(false)}>Cancel<//>
        <${Btn} variant="primary" onClick=${updateTeam}>Save Changes<//>
      </div>
    <//>`}
    ${toast&&html`<${Toast} msg=${toast.msg} type=${toast.type} onDone=${()=>setToast(null)}/>`}`;
}
function Onboarding({onComplete}){
  const[step,setStep]=useState(0);const[email,setEmail]=useState('');const[name,setName]=useState('');const[prov,setProv]=useState('openai');const[pk,setPk]=useState('');
  const[result,setResult]=useState(null);const[err,setErr]=useState('');const[loading,setLoading]=useState(false);
  const createUser=async()=>{setLoading(true);setErr('');const r=await api('/api/auth/users',{method:'POST',body:JSON.stringify({email,name})});setLoading(false);if(r._error||r.error){setErr(r.error||'Failed');return}setResult(r);setStep(1)};
  const addProvider=async()=>{if(!result?.user)return;setLoading(true);setErr('');const r=await api('/api/auth/users/'+result.user.id+'/providers/'+prov,{method:'PUT',body:JSON.stringify({api_key:pk})});setLoading(false);if(r._error||r.error){setErr(r.error||'Failed');return}setStep(2)};
  const finish=()=>{sessionStorage.setItem('sy_onboarded','1');onComplete()};
  const STEPS=[{n:'Create User',d:'Set up the first user account.'},{n:'Add Provider',d:'Connect your LLM provider API key.'},{n:'Ready',d:'Your proxy is configured.'}];
  return html`<div class="onboard-overlay"><div class="onboard-box">
    <div class="onboard-header"><div style="font-family:var(--font-mono);font-size:0.65rem;letter-spacing:3px;text-transform:uppercase;color:var(--leather);margin-bottom:8px">Welcome to Stockyard</div>
    <h2 style="font-size:1.4rem;margin-bottom:4px">Quick Setup</h2><p style="color:var(--cream-dim);font-style:italic;font-size:0.9rem">Get proxying in 2 minutes.</p></div>
    <div class="onboard-steps">${STEPS.map((s,i)=>html`<div key=${i} class="onboard-step ${i===step?'active':i<step?'done':''}"><span class="onboard-step-num">${i<step?'\u2713':i+1}</span><span>${s.n}</span></div>`)}</div>
    <div class="onboard-content">
    ${step===0?html`<${Input} label="Email" value=${email} onChange=${setEmail} placeholder="you@company.com"/>
      <${Input} label="Name (optional)" value=${name} onChange=${setName} placeholder="Your name"/>
      ${err&&html`<div style="color:var(--red);font-size:0.8rem;margin-bottom:8px">${err}</div>`}
      <${Btn} variant="primary" onClick=${createUser} disabled=${!email||loading}>${loading?'Creating...':'Create User & API Key'}<//>
      ${result&&html`<div class="key-alert" style="margin-top:12px"><div class="key-alert-title">Your API Key (copy now)</div><code class="key-alert-value">${result.api_key?.key}</code></div>`}`:
    step===1?html`<${Select} label="Provider" value=${prov} onChange=${setProv} options=${[{value:'openai',label:'OpenAI'},{value:'anthropic',label:'Anthropic'},{value:'gemini',label:'Google Gemini'},{value:'groq',label:'Groq'}]}/>
      <${Input} label="API Key" value=${pk} onChange=${setPk} type="password" placeholder="sk-..." mono/>
      ${err&&html`<div style="color:var(--red);font-size:0.8rem;margin-bottom:8px">${err}</div>`}
      <div style="display:flex;gap:8px"><${Btn} variant="primary" onClick=${addProvider} disabled=${!pk||loading}>${loading?'Saving...':'Save Provider Key'}<//><${Btn} onClick=${()=>setStep(2)}>Skip for now<//></div>`:
    html`<div style="text-align:center;padding:24px 0">
      <div style="font-size:2rem;margin-bottom:12px">\u2713</div>
      <p style="font-size:1rem;margin-bottom:8px">You\u2019re all set!</p>
      <p style="color:var(--cream-dim);font-size:0.85rem;margin-bottom:20px">Your proxy is ready at <code>/v1/chat/completions</code></p>
      <pre style="background:var(--bg);border:1px solid var(--bg3);padding:12px;font-family:var(--font-mono);font-size:0.75rem;text-align:left;color:var(--cream-dim);margin-bottom:20px">curl https://YOUR_HOST/v1/chat/completions \\\n  -H "Authorization: Bearer ${result?.api_key?.key||'sk-sy-...'}" \\\n  -H "Content-Type: application/json" \\\n  -d '{"model":"gpt-4","messages":[{"role":"user","content":"Hello"}]}'</pre>
      <${Btn} variant="primary" onClick=${finish}>Open Console<//></div>`}
    </div></div></div>`;
}

function AuthGate({onAuth}){
  const[key,setKey]=useState('');const[err,setErr]=useState('');
  const tryAuth=async()=>{setAdminKey(key);const r=await api('/api/proxy/modules');if(r._error===401||r._error===403){setErr('Invalid key');setAdminKey('');return}onAuth()};
  return html`<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)"><div style="width:380px;padding:2rem;border:1px solid var(--bg3);background:var(--bg2)">
    <div style="font-family:var(--font-mono);font-size:0.65rem;letter-spacing:3px;text-transform:uppercase;color:var(--leather);margin-bottom:1.5rem;text-align:center">Stockyard Console</div>
    <div style="margin-bottom:1rem"><div style="font-family:var(--font-mono);font-size:0.7rem;color:var(--leather-light);margin-bottom:0.4rem">Admin Key</div>
    <input type="password" value=${key} onInput=${e=>setKey(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&tryAuth()} style="width:100%;padding:0.6rem 0.8rem;background:var(--bg);border:1px solid var(--bg3);color:var(--cream);font-family:var(--font-mono);font-size:0.85rem;outline:none" placeholder="sy_admin_..."/></div>
    ${err&&html`<div style="font-family:var(--font-mono);font-size:0.75rem;color:var(--red);margin-bottom:0.8rem">${err}</div>`}
    <button onClick=${tryAuth} style="width:100%;padding:0.7rem;background:var(--rust);color:var(--cream);border:2px solid var(--rust);font-family:var(--font-mono);font-size:0.85rem;cursor:pointer">Authenticate</button>
  </div></div>`;
}

function TeamPicker(){
  const[teams,setTeams]=useState([]);const[sel,setSel]=useState(getTeamScope());
  useEffect(()=>{(async()=>{const r=await fetch('/api/teams',{headers:{'X-Admin-Key':sessionStorage.getItem('sy_admin_key')||''}});if(r.ok){const d=await r.json();setTeams(d.teams||[])}})()},[]);
  const onChange=v=>{setSel(v);setTeamScope(v);window.dispatchEvent(new Event('teamchange'))};
  if(teams.length===0)return null;
  return html`<div style="padding:0 1rem;margin-bottom:0.5rem">
    <div style="font-family:var(--font-mono);font-size:0.6rem;letter-spacing:2px;text-transform:uppercase;color:var(--leather);margin-bottom:4px">Scope</div>
    <select value=${sel} onChange=${e=>onChange(e.target.value)} style="width:100%;padding:4px 6px;background:var(--bg);border:1px solid var(--bg3);color:${sel?'var(--rust-light)':'var(--cream-dim)'};font-family:var(--font-mono);font-size:0.72rem;outline:none;cursor:pointer">
      <option value="">All Teams</option>
      ${teams.map(t=>html`<option key=${t.id} value=${t.id}>${t.name}</option>`)}
    </select>
  </div>`;
}

function App(){
  const[active,setActive]=useState('overview');const[authed,setAuthed]=useState(!!sessionStorage.getItem('sy_admin_key'));const[onboarded,setOnboarded]=useState(!!sessionStorage.getItem('sy_onboarded'));const[needsOnboard,setNeedsOnboard]=useState(false);
  const[teamVer,setTeamVer]=useState(0);
  const View=VIEWS[active]||OverviewView;
  useEffect(()=>{(async()=>{const r=await api('/api/proxy/modules');if(r._error===401||r._error===403){setAuthed(false);return}setAuthed(true);if(!sessionStorage.getItem('sy_onboarded')){const u=await api('/api/auth/users');if(!u.users||u.users.length===0){setNeedsOnboard(true)}}})()},[]);
  useEffect(()=>{const h=()=>setTeamVer(v=>v+1);window.addEventListener('teamchange',h);return()=>window.removeEventListener('teamchange',h)},[]);
  if(!authed)return html`<${AuthGate} onAuth=${()=>setAuthed(true)}/>`;
  const logout=()=>{setAdminKey('');setAuthed(false)};
  if(needsOnboard)return html`<${Onboarding} onComplete=${()=>setNeedsOnboard(false)}/>`;
  return html`<div class="shell"><nav class="nav">
    <div class="nav-brand" onClick=${()=>setActive('overview')}><span class="nav-brand-text">Stockyard</span></div>
    <${TeamPicker}/>
    <div class="nav-divider"></div><div class="nav-section">Apps</div>
    ${APP_ORDER.map(id=>{const a=APPS[id];return html`<button key=${id} class="nav-item ${active===id?'active':''}" onClick=${()=>setActive(id)}><span class="nav-icon">${a.icon}</span><span class="nav-label">${a.name}</span></button>`})}
    <div class="nav-spacer"></div><div class="nav-divider"></div>
    <button class="nav-item ${active==='teams'?'active':''}" onClick=${()=>setActive('teams')}><span class="nav-icon">\u{1F465}</span><span class="nav-label">Teams</span></button>
    <button class="nav-item ${active==='settings'?'active':''}" onClick=${()=>setActive('settings')}><span class="nav-icon">\u2699</span><span class="nav-label">Settings</span></button>
    <a class="nav-item" href="/api/apps" target="_blank"><span class="nav-icon">{}</span><span class="nav-label">Raw API</span></a>
    <a class="nav-item" href="https://stockyard.dev/docs" target="_blank"><span class="nav-icon">?</span><span class="nav-label">Docs</span></a>
    <button class="nav-item" onClick=${logout}><span class="nav-icon">\u23FB</span><span class="nav-label">Logout</span></button>
    <div class="nav-footer"><span class="nav-version">v1.0 \u00B7 18 products \u00B7 360+ endpoints</span></div>
  </nav><main class="content"><${UpgradeBanner}/><${View} key=${active+'-'+teamVer}/></main></div>`;
}
render(html`<${App}/>`,document.getElementById('root'));
</script>
<style>
:root{--bg:#1a1410;--bg2:#241e18;--bg3:#2e261e;--rust:#c45d2c;--rust-light:#e8753a;--rust-dark:#8b3d1a;--leather:#a0845c;--leather-light:#c4a87a;--cream:#f0e6d3;--cream-dim:#bfb5a3;--cream-muted:#7a7060;--gold:#d4a843;--green:#5a9a4a;--green-s:rgba(90,154,74,0.15);--red:#c44a3a;--red-s:rgba(196,74,58,0.15);--amber:#d4a843;--amber-s:rgba(212,168,67,0.15);--muted-s:rgba(160,132,92,0.1);--font-serif:'Libre Baskerville',Georgia,serif;--font-mono:'JetBrains Mono',monospace;--nav-w:220px}

.dt-body{max-height:480px;overflow-y:auto}.dt-row{display:grid;padding:10px 20px;font-size:0.85rem;align-items:center;border-bottom:1px solid var(--bg3);transition:background 0.1s;cursor:default}.dt-row:last-child{border-bottom:none}.dt-row:hover{background:rgba(46,38,30,0.5)}
