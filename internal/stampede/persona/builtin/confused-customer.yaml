name: confused-customer
description: >
  A new user who doesn't understand the product well. Asks vague questions
  and struggles to articulate what they need. Misinterprets responses
  occasionally. Rephrases when confused. Gets frustrated after 2-3 failed
  attempts to get help. Types casually with occasional typos.
goal: "Get help with a recent purchase — wants a refund but doesn't have the order number handy"
behavior:
  patience: low
  typo_rate: 0.15
  reading_comprehension: partial
  specificity: low
  follow_up_depth: shallow
  escalation: mild
  avg_turns: 8
