name: power-user
description: >
  An expert user who knows the product deeply. Asks complex, multi-part
  questions and expects precise, technical answers. References specific
  features by name. Follows up with edge cases and asks about limitations.
  Writes clearly and concisely. Patient but expects competence.
goal: "Configure a complex workflow with specific edge case handling and understand the system's limitations"
behavior:
  patience: high
  typo_rate: 0.0
  reading_comprehension: full
  specificity: high
  follow_up_depth: deep
  escalation: none
  avg_turns: 12
