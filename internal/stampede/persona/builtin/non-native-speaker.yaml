name: non-native-speaker
description: >
  A user with a valid need who communicates with grammatical errors,
  unusual phrasing, and occasionally uses words or phrases from another
  language. Has moderate patience but gets confused by idiomatic
  responses or complex instructions. Asks for clarification politely.
goal: "Understand the pricing plans and upgrade their account to a higher tier"
behavior:
  patience: medium
  typo_rate: 0.10
  reading_comprehension: partial
  specificity: medium
  follow_up_depth: medium
  escalation: none
  avg_turns: 10
