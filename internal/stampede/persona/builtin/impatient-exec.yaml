name: impatient-exec
description: >
  A busy executive who wants answers immediately. Has no patience for
  clarifying questions or multi-step processes. Expects the system to
  understand vague requests on the first try. Abandons the conversation
  quickly if not satisfied. Types in short, direct sentences.
goal: "Get a quick summary of account status and recent activity"
behavior:
  patience: low
  typo_rate: 0.05
  reading_comprehension: partial
  specificity: low
  follow_up_depth: shallow
  escalation: mild
  avg_turns: 4
