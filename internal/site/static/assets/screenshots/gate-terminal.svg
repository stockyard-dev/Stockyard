<rect y="43" width="680" height="2" fill="#2e261e"/>
<circle cx="18" cy="22" r="5" fill="#c0392b"/>
<circle cx="36" cy="22" r="5" fill="#d4a843"/>
<circle cx="54" cy="22" r="5" fill="#5ba86e"/>
<text x="340" y="26" text-anchor="middle" fill="#a0845c" font-size="11" font-family="JetBrains Mono,monospace">gate — auth proxy</text>
<rect x="590" y="13" width="72" height="18" rx="3" fill="none" stroke="#e8753a" stroke-width="1"/>
<text x="626" y="25" text-anchor="middle" fill="#e8753a" font-size="9" font-family="JetBrains Mono,monospace" letter-spacing="1">RUNNING</text>
<text x="20" y="64" fill="#7a7060" font-size="12" font-family="JetBrains Mono,monospace">$ </text><text x="36" y="64" fill="#f0e6d3" font-size="12" font-family="JetBrains Mono,monospace">GATE_UPSTREAM=http://localhost:3000 GATE_ADMIN_KEY=secret gate</text><text x="20" y="104" fill="#e8753a" font-size="12" font-family="JetBrains Mono,monospace">  Stockyard Gate v0.1.0</text><text x="20" y="124" fill="#c4a87a" font-size="12" font-family="JetBrains Mono,monospace">  Proxy:      http://localhost:8780 → http://localhost:3000</text><text x="20" y="144" fill="#c4a87a" font-size="12" font-family="JetBrains Mono,monospace">  Admin API:  http://localhost:8780/gate/api</text><text x="20" y="164" fill="#c4a87a" font-size="12" font-family="JetBrains Mono,monospace">  Dashboard:  http://localhost:8780/ui</text><text x="20" y="184" fill="#5ba86e" font-size="12" font-family="JetBrains Mono,monospace">  License:    Pro (you@example.com)</text><line x1="20" y1="220" x2="660" y2="220" stroke="#2e261e" stroke-width="1"/><text x="20" y="264" fill="#7a7060" font-size="12" font-family="JetBrains Mono,monospace">$ </text><text x="36" y="264" fill="#f0e6d3" font-size="12" font-family="JetBrains Mono,monospace">curl -s -X POST localhost:8780/gate/api/keys -H 'Authorization: Bearer secret'</text><text x="20" y="284" fill="#7a7060" font-size="12" font-family="JetBrains Mono,monospace">$ </text><text x="36" y="284" fill="#f0e6d3" font-size="12" font-family="JetBrains Mono,monospace">     -d '{"name":"alice","role":"user"}'</text><text x="20" y="304" fill="#d4a843" font-size="12" font-family="JetBrains Mono,monospace">→ {"key":"sk-gate-AbC1xYz...","note":"Save this — shown once"}</text><text x="20" y="344" fill="#7a7060" font-size="12" font-family="JetBrains Mono,monospace"># Without a key: blocked</text><text x="20" y="364" fill="#c4a87a" font-size="12" font-family="JetBrains Mono,monospace">curl -s localhost:8780/api/data</text><text x="20" y="384" fill="#e8753a" font-size="12" font-family="JetBrains Mono,monospace">→ {"error":"authentication required"}  HTTP 401</text><text x="20" y="424" fill="#7a7060" font-size="12" font-family="JetBrains Mono,monospace"># With the key: proxied to upstream</text><text x="20" y="444" fill="#c4a87a" font-size="12" font-family="JetBrains Mono,monospace">curl -s -H "Authorization: Bearer sk-gate-AbC1xYz..." localhost:8780/api/data</text><text x="20" y="464" fill="#5ba86e" font-size="12" font-family="JetBrains Mono,monospace">→ {"data":"..."}  HTTP 200  12ms</text>
</svg>