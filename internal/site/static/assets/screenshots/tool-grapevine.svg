<text x="32" y="204" fill="#f0e6d3" font-size="14" font-family="Libre Baskerville,Georgia,serif" font-weight="bold">Can I change plans mid-month?</text>
<text x="32" y="230" fill="#bfb5a3" font-size="11" font-family="Libre Baskerville,Georgia,serif">Yes. The change takes effect immediately and we prorate the difference</text>
<text x="32" y="248" fill="#bfb5a3" font-size="11" font-family="Libre Baskerville,Georgia,serif">on your next invoice. Downgrades take effect at the end of the period.</text>
<text x="32" y="274" fill="#f0e6d3" font-size="14" font-family="Libre Baskerville,Georgia,serif" font-weight="bold">What happens if my payment fails?</text>
<text x="32" y="300" fill="#bfb5a3" font-size="11" font-family="Libre Baskerville,Georgia,serif">We retry three times over five days, then send you an email. After 14</text>
<text x="32" y="318" fill="#bfb5a3" font-size="11" font-family="Libre Baskerville,Georgia,serif">days of failed payments your account is paused but no data is deleted.</text>
