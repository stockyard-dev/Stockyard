<text x="32" y="130" fill="#f0e6d3" font-size="22" font-family="Libre Baskerville,Georgia,serif" font-weight="bold">Customer interview — Marcus Webb</text>
<text x="32" y="152" fill="#a0845c" font-size="10" font-family="JetBrains Mono,monospace">transcribed · Sept 28 · 32 min</text>
<line x1="32" y1="170" x2="688" y2="170" stroke="#2e261e" stroke-width="1"/>
<text x="32" y="204" fill="#a0845c" font-size="10" font-family="JetBrains Mono,monospace">[00:00] How long have you been using the product?</text>
<text x="32" y="222" fill="#bfb5a3" font-size="11" font-family="Libre Baskerville,Georgia,serif">About eight months, I think. Started right after the v2 launch.</text>
<text x="32" y="248" fill="#a0845c" font-size="10" font-family="JetBrains Mono,monospace">[00:24] What problem were you trying to solve when you first signed up?</text>
<text x="32" y="266" fill="#bfb5a3" font-size="11" font-family="Libre Baskerville,Georgia,serif">We were paying $400 a month for three different SaaS tools that did</text>
<text x="32" y="284" fill="#bfb5a3" font-size="11" font-family="Libre Baskerville,Georgia,serif">pieces of what we needed. Wanted one place that owned the data.</text>
<text x="32" y="310" fill="#a0845c" font-size="10" font-family="JetBrains Mono,monospace">[01:08] Has it changed how your team works day-to-day?</text>
<text x="32" y="328" fill="#bfb5a3" font-size="11" font-family="Libre Baskerville,Georgia,serif">Honestly the biggest change is we stopped having the &quot;where does this</text>
<text x="32" y="346" fill="#bfb5a3" font-size="11" font-family="Libre Baskerville,Georgia,serif">live&quot; conversation in standup every morning. Everything is in one tool.</text>
<text x="32" y="448" fill="#a0845c" font-size="9" font-family="JetBrains Mono,monospace" letter-spacing="2">TAGS</text>
