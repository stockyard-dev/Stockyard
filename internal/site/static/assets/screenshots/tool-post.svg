<rect x="16" y="92" width="688" height="372" rx="6" fill="#241e18" stroke="#2e261e"/>
<text x="32" y="130" fill="#f0e6d3" font-size="22" font-family="Libre Baskerville,Georgia,serif" font-weight="bold">Why we left AWS for our own metal</text>
<text x="32" y="152" fill="#a0845c" font-size="10" font-family="JetBrains Mono,monospace">draft · ER · saved 2m ago</text>
<line x1="32" y1="170" x2="688" y2="170" stroke="#2e261e" stroke-width="1"/>
<text x="32" y="204" fill="#bfb5a3" font-size="11" font-family="Libre Baskerville,Georgia,serif">For the last three years our infrastructure bill has been the second</text>
<text x="32" y="222" fill="#bfb5a3" font-size="11" font-family="Libre Baskerville,Georgia,serif">largest line item in the company. Last quarter it crossed our payroll</text>
<text x="32" y="240" fill="#bfb5a3" font-size="11" font-family="Libre Baskerville,Georgia,serif">line. We finally sat down and did the work to figure out exactly what</text>
<text x="32" y="258" fill="#bfb5a3" font-size="11" font-family="Libre Baskerville,Georgia,serif">we were paying for, and the answer was honestly upsetting.</text>
<text x="32" y="284" fill="#f0e6d3" font-size="14" font-family="Libre Baskerville,Georgia,serif" font-weight="bold">What we moved</text>
<text x="32" y="310" fill="#bfb5a3" font-size="11" font-family="Libre Baskerville,Georgia,serif">The compute layer was the easy part. We took our four largest services</text>
<text x="32" y="328" fill="#bfb5a3" font-size="11" font-family="Libre Baskerville,Georgia,serif">off ECS and put them on bare metal Hetzner boxes for one tenth the cost.</text>
<text x="32" y="448" fill="#a0845c" font-size="9" font-family="JetBrains Mono,monospace" letter-spacing="2">TAGS</text>
<rect x="80" y="436" width="49" height="18" rx="2" fill="none" stroke="#a0845c"/>
