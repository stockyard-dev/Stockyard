<text x="32" y="204" fill="#f0e6d3" font-size="14" font-family="Libre Baskerville,Georgia,serif" font-weight="bold">Day 1 — accounts and access</text>
<circle cx="40" cy="226" r="2.5" fill="#e8753a"/>
<text x="50" y="230" fill="#bfb5a3" font-size="11" font-family="Libre Baskerville,Georgia,serif">Get a GitHub invite from your manager (post in #ops)</text>
<circle cx="40" cy="244" r="2.5" fill="#e8753a"/>
<text x="50" y="248" fill="#bfb5a3" font-size="11" font-family="Libre Baskerville,Georgia,serif">Set up 1Password and grab the dev secrets vault</text>
<circle cx="40" cy="262" r="2.5" fill="#e8753a"/>
<text x="50" y="266" fill="#bfb5a3" font-size="11" font-family="Libre Baskerville,Georgia,serif">Clone the monorepo: git clone gh:stockyard-dev/Stockyard</text>
<circle cx="40" cy="280" r="2.5" fill="#e8753a"/>
<text x="50" y="284" fill="#bfb5a3" font-size="11" font-family="Libre Baskerville,Georgia,serif">Run ./scripts/bootstrap.sh — takes about 12 minutes</text>
<text x="32" y="310" fill="#f0e6d3" font-size="14" font-family="Libre Baskerville,Georgia,serif" font-weight="bold">Day 2 — your first PR</text>
<text x="32" y="336" fill="#bfb5a3" font-size="11" font-family="Libre Baskerville,Georgia,serif">Pick any open issue tagged &quot;good-first-issue&quot; in the bounty repo. The</text>
<text x="32" y="354" fill="#bfb5a3" font-size="11" font-family="Libre Baskerville,Georgia,serif">goal is to get a PR merged before lunch on day 2, even a tiny one.</text>
