<svg xmlns="http://www.w3.org/2000/svg" width="680" height="504" viewBox="0 0 680 504" role="img" aria-label="fence — api key vault terminal output">
<rect width="680" height="504" rx="8" fill="#1a1410"/>
<rect width="680" height="44" rx="8" fill="#241e18"/>
<rect y="43" width="680" height="2" fill="#2e261e"/>
<circle cx="18" cy="22" r="5" fill="#c0392b"/>
<circle cx="36" cy="22" r="5" fill="#d4a843"/>
<circle cx="54" cy="22" r="5" fill="#5ba86e"/>
<text x="340" y="26" text-anchor="middle" fill="#a0845c" font-size="11" font-family="JetBrains Mono,monospace">fence — api key vault</text>
<rect x="590" y="13" width="72" height="18" rx="3" fill="none" stroke="#e8753a" stroke-width="1"/>
<text x="626" y="25" text-anchor="middle" fill="#e8753a" font-size="9" font-family="JetBrains Mono,monospace" letter-spacing="1">RUNNING</text>
<text x="20" y="64" fill="#7a7060" font-size="12" font-family="JetBrains Mono,monospace">$ </text><text x="36" y="64" fill="#f0e6d3" font-size="12" font-family="JetBrains Mono,monospace">FENCE_ADMIN_KEY=secret FENCE_ENCRYPTION_KEY=$(openssl rand -hex 32) fence</text><text x="20" y="104" fill="#e8753a" font-size="12" font-family="JetBrains Mono,monospace">  Stockyard Fence v0.1.0</text><text x="20" y="124" fill="#c4a87a" font-size="12" font-family="JetBrains Mono,monospace">  API:      http://localhost:8770/api</text><text x="20" y="144" fill="#c4a87a" font-size="12" font-family="JetBrains Mono,monospace">  Resolve:  http://localhost:8770/api/resolve/{key_name}</text><text x="20" y="164" fill="#5ba86e" font-size="12" font-family="JetBrains Mono,monospace">  License:  Pro (you@example.com)</text><line x1="20" y1="200" x2="660" y2="200" stroke="#2e261e" stroke-width="1"/><text x="20" y="244" fill="#7a7060" font-size="12" font-family="JetBrains Mono,monospace"># Store an encrypted key in the production vault</text><text x="20" y="264" fill="#7a7060" font-size="12" font-family="JetBrains Mono,monospace">$ </text><text x="36" y="264" fill="#f0e6d3" font-size="12" font-family="JetBrains Mono,monospace">curl -s -X POST localhost:8770/api/vaults/vlt_prod/keys \</text><text x="20" y="284" fill="#7a7060" font-size="12" font-family="JetBrains Mono,monospace">$ </text><text x="36" y="284" fill="#f0e6d3" font-size="12" font-family="JetBrains Mono,monospace">  -d '{"name":"openai","value":"sk-...","provider":"openai"}'</text><text x="20" y="304" fill="#d4a843" font-size="12" font-family="JetBrains Mono,monospace">→ {"key":{"id":"key_9x3f","name":"openai"},"note":"value encrypted at rest"}</text><text x="20" y="344" fill="#7a7060" font-size="12" font-family="JetBrains Mono,monospace"># Team member resolves the key at runtime with their token</text><text x="20" y="364" fill="#7a7060" font-size="12" font-family="JetBrains Mono,monospace">$ </text><text x="36" y="364" fill="#f0e6d3" font-size="12" font-family="JetBrains Mono,monospace">curl -s localhost:8770/api/resolve/openai \</text><text x="20" y="384" fill="#7a7060" font-size="12" font-family="JetBrains Mono,monospace">$ </text><text x="36" y="384" fill="#f0e6d3" font-size="12" font-family="JetBrains Mono,monospace">  -H "Authorization: Bearer fence_AbCd1234..."</text><text x="20" y="404" fill="#5ba86e" font-size="12" font-family="JetBrains Mono,monospace">→ {"key":"openai","value":"sk-..."}</text><text x="20" y="444" fill="#7a7060" font-size="12" font-family="JetBrains Mono,monospace"># Every access is logged</text><text x="20" y="464" fill="#c4a87a" font-size="12" font-family="JetBrains Mono,monospace">[fence] resolve key=openai vault=vlt_prod member=alice</text>
</svg>