<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cron Expression Builder — Visual Cron Generator | Stockyard</title>
<meta name="description" content="Build cron expressions visually. See the next 5 run times. Generate systemd timers and Stockyard tool configs. Free, no signup.">
<link rel="canonical" href="https://stockyard.dev/cron/">
<meta property="og:image" content="https://stockyard.dev/site-assets/assets/marketing/og-card.png">
<style>
:root{--bg:#1a1410;--bg2:#241e18;--bg3:#2e261e;--rust:#c45d2c;--rl:#e8753a;--leather:#a0845c;--cream:#f0e6d3;--cd:#bfb5a3;--cm:#7a7060;--gold:#d4a843;--green:#4a9e5c;--mono:'JetBrains Mono',Consolas,monospace;--serif:'Libre Baskerville',Georgia,serif}
@media(prefers-color-scheme:light){:root{--bg:#faf7f2;--bg2:#f0ebe3;--bg3:#e0d9ce;--rust:#b04a1e;--rl:#c45d2c;--leather:#7a6544;--cream:#1a1410;--cd:#4a4035;--cm:#8a806e;--gold:#b08a28;--green:#2d7a3e}}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--cream);font-family:var(--serif);line-height:1.7}a{color:var(--rl);text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:2rem}
h1{font-size:clamp(1.4rem,3.5vw,2rem);text-align:center;margin-bottom:.5rem}
.sub{color:var(--cd);font-style:italic;text-align:center;margin-bottom:2rem}
.row{display:flex;gap:.8rem;margin-bottom:.8rem;align-items:center;flex-wrap:wrap}
.row label{font-family:var(--mono);font-size:.7rem;color:var(--cm);min-width:70px}
.row select,.row input{background:var(--bg2);border:1px solid var(--bg3);color:var(--cream);padding:.4rem .6rem;font-family:var(--mono);font-size:.8rem;flex:1;min-width:80px}
.row select:focus,.row input:focus{border-color:var(--rust);outline:none}
.expr{background:var(--bg2);border:2px solid var(--rust);padding:1rem;text-align:center;font-family:var(--mono);font-size:1.4rem;color:var(--cream);margin:1.5rem 0;cursor:pointer;letter-spacing:4px}
.expr:hover{border-color:var(--gold)}
.human{text-align:center;color:var(--cd);font-size:.9rem;margin-bottom:1.5rem}
.next{background:var(--bg2);border:1px solid var(--bg3);padding:1rem;font-family:var(--mono);font-size:.75rem;color:var(--cd);line-height:1.8}
.next-label{font-size:.65rem;color:var(--cm);text-transform:uppercase;letter-spacing:2px;margin-bottom:.5rem}
.outputs{margin-top:1.5rem}
.out-label{font-family:var(--mono);font-size:.65rem;color:var(--cm);text-transform:uppercase;letter-spacing:1px;margin-bottom:.3rem;margin-top:1rem}
.out-code{background:var(--bg2);border:1px solid var(--bg3);padding:.6rem;font-family:var(--mono);font-size:.75rem;color:var(--cream);cursor:pointer;overflow-x:auto}
.out-code:hover{border-color:var(--leather)}
</style>
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Cron Expression Builder","url":"https://stockyard.dev/cron/","description":"Build cron expressions visually with a free online cron generator.","applicationCategory":"DeveloperApplication","operatingSystem":"Web"}
</script>
</head>
<body>
<div class="wrap">
<div style="font-family:var(--mono);font-size:.7rem;letter-spacing:4px;text-transform:uppercase;color:var(--leather);margin-bottom:1.5rem;text-align:center">Tool</div>
<h1>Cron Expression Builder</h1>
<p class="sub">Build cron expressions visually. Click the expression to copy.</p>

<div class="row"><label>Minute</label><select id="min" onchange="build()"><option value="*">Every minute (*)</option><option value="0">0</option><option value="5">5</option><option value="10">10</option><option value="15">15</option><option value="20">20</option><option value="30">30</option><option value="45">45</option><option value="*/5">Every 5 min</option><option value="*/10">Every 10 min</option><option value="*/15">Every 15 min</option><option value="*/30">Every 30 min</option></select></div>

<div class="row"><label>Hour</label><select id="hr" onchange="build()"><option value="*">Every hour (*)</option><option value="0">Midnight (0)</option><option value="1">1 AM</option><option value="2">2 AM</option><option value="3">3 AM</option><option value="6">6 AM</option><option value="8">8 AM</option><option value="9">9 AM</option><option value="12">Noon (12)</option><option value="17">5 PM (17)</option><option value="18">6 PM (18)</option><option value="21">9 PM (21)</option><option value="*/2">Every 2 hours</option><option value="*/4">Every 4 hours</option><option value="*/6">Every 6 hours</option><option value="*/12">Every 12 hours</option></select></div>

<div class="row"><label>Day</label><select id="dom" onchange="build()"><option value="*">Every day (*)</option><option value="1">1st</option><option value="15">15th</option><option value="1,15">1st & 15th</option></select></div>

<div class="row"><label>Month</label><select id="mon" onchange="build()"><option value="*">Every month (*)</option><option value="1">January</option><option value="6">June</option><option value="12">December</option><option value="1,4,7,10">Quarterly</option></select></div>

<div class="row"><label>Weekday</label><select id="dow" onchange="build()"><option value="*">Every day (*)</option><option value="1-5">Weekdays (Mon-Fri)</option><option value="0,6">Weekends</option><option value="1">Monday</option><option value="5">Friday</option></select></div>

<div class="expr" id="expr" onclick="navigator.clipboard.writeText(this.textContent).then(()=>{this.style.borderColor='var(--green)';setTimeout(()=>this.style.borderColor='',1000)})">* * * * *</div>
<div class="human" id="human">Every minute</div>

<div class="next"><div class="next-label">Next 5 runs</div><div id="runs"></div></div>

<div class="outputs">
<div class="out-label">Systemd timer</div>
<div class="out-code" id="systemd" onclick="navigator.clipboard.writeText(this.textContent)"></div>
<div class="out-label">Stockyard Mainspring config</div>
<div class="out-code" id="mainspring" onclick="navigator.clipboard.writeText(this.textContent)"></div>
</div>

<div style="text-align:center;margin-top:2rem;font-family:var(--mono);font-size:.8rem">
<a href="/mainspring/">Mainspring (cron scheduler)</a> · <a href="/systemd/">Systemd generator</a> · <a href="/tools/">All 150 tools</a>
</div>
</div>

<script>
var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function build(){
  var m=document.getElementById('min').value;
  var h=document.getElementById('hr').value;
  var d=document.getElementById('dom').value;
  var mo=document.getElementById('mon').value;
  var w=document.getElementById('dow').value;
  var expr=m+' '+h+' '+d+' '+mo+' '+w;
  document.getElementById('expr').textContent=expr;

  // Human readable
  var parts=[];
  if(m==='*')parts.push('Every minute');
  else if(m.startsWith('*/'))parts.push('Every '+m.slice(2)+' minutes');
  else parts.push('At minute '+m);

  if(h==='*'){}
  else if(h.startsWith('*/'))parts.push('every '+h.slice(2)+' hours');
  else parts.push('at '+h+':00');

  if(w==='1-5')parts.push('on weekdays');
  else if(w==='0,6')parts.push('on weekends');
  else if(w!=='*')parts.push('on '+w.split(',').map(function(x){return DAYS[x]}).join(', '));

  if(d!=='*')parts.push('on day '+d);
  if(mo!=='*')parts.push('in month '+mo);

  document.getElementById('human').textContent=parts.join(', ');

  // Next 5 runs (simplified)
  var now=new Date();var runs=[];
  for(var i=0;i<60*24*7&&runs.length<5;i++){
    var t=new Date(now.getTime()+i*60000);
    if(matchCron(t,m,h,d,mo,w))runs.push(t.toLocaleString());
  }
  document.getElementById('runs').innerHTML=runs.map(function(r){return '<div>'+r+'</div>'}).join('');

  // Systemd
  var cal='*-*-* *:*:00';
  if(h!=='*'&&!h.startsWith('*/'))cal=cal.replace('*:*:','(h.length===1?"0":"")+h+":"+((m==="*"?"*":(m.length===1?"0"+m:m)))+":');
  document.getElementById('systemd').textContent='[Timer]\nOnCalendar='+expr+'\nPersistent=true';

  // Mainspring
  document.getElementById('mainspring').textContent='curl -X POST localhost:8810/api/jobs -d \'{"name":"my-job","schedule":"'+expr+'","command":"echo hello"}\'';
}

function matchCron(t,m,h,d,mo,w){
  if(!matchField(t.getMinutes(),m))return false;
  if(!matchField(t.getHours(),h))return false;
  if(!matchField(t.getDate(),d))return false;
  if(!matchField(t.getMonth()+1,mo))return false;
  if(!matchField(t.getDay(),w))return false;
  return true;
}

function matchField(val,field){
  if(field==='*')return true;
  if(field.startsWith('*/'))return val%parseInt(field.slice(2))===0;
  if(field.includes('-')){var p=field.split('-');return val>=parseInt(p[0])&&val<=parseInt(p[1])}
  return field.split(',').some(function(v){return parseInt(v)===val});
}

build();
</script>
<script>(function(){var p=new URLSearchParams(window.location.search);var r=p.get("ref");if(r)fetch("/api/affiliate/track?code="+encodeURIComponent(r)+"&page="+encodeURIComponent(window.location.pathname))})()</script>
</body>
</html>
