<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout Cancelled — Stockyard</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1a1410;--bg2:#241e18;--rust:#c45d2c;--cream:#f0e6d3;--cream-dim:#bfb5a3;--font-serif:'Libre Baskerville',Georgia,serif;--font-mono:'JetBrains Mono',monospace}
body{font-family:var(--font-serif);background:var(--bg);color:var(--cream);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
.card{background:var(--bg2);border:1px solid #3a3228;border-radius:12px;padding:3rem;max-width:520px;text-align:center}
h1{font-size:1.6rem;margin-bottom:0.75rem}
p{color:var(--cream-dim);line-height:1.6;margin-bottom:1.5rem}
.buttons{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.cta{display:inline-block;background:var(--rust);color:var(--cream);padding:0.75rem 2rem;border-radius:6px;text-decoration:none;font-family:var(--font-mono);font-size:0.85rem;transition:opacity 0.2s}
.cta:hover{opacity:0.85}
.secondary{background:transparent;border:1px solid var(--cream-dim)}

.nav-links>a.nav-complete{color:var(--gold)}.nav-links>a.nav-complete:hover{color:var(--leather-light)}
.nav-drop{position:relative}.nav-drop-trigger{color:var(--cream-dim);cursor:pointer;user-select:none}.nav-drop-trigger:hover{color:var(--rust-light)}
.drop-arrow{font-size:0.65rem;margin-left:2px}
.nav-drop-menu{display:none;position:absolute;top:calc(100% + 0.8rem);right:0;background:var(--bg2);border:1px solid var(--bg3);min-width:200px;padding:0.5rem 0;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,0.4)}
.nav-drop-menu.open{display:block}
.nav-drop-menu a{display:block;padding:0.4rem 1.2rem;font-family:var(--font-mono);font-size:0.78rem;color:var(--cream-dim)}.nav-drop-menu a:hover{color:var(--rust-light);background:var(--bg3)}
.drop-section{padding:0.3rem 1.2rem;font-size:0.6rem;letter-spacing:2px;text-transform:uppercase;color:var(--leather);margin-top:0.3rem}
@media(max-width:768px){.nav-drop-trigger{font-size:1.05rem;padding:0.4rem 0;display:block}.nav-drop-menu{display:none;position:static;background:transparent;border:none;padding:0 0 0 1rem;box-shadow:none;margin-top:0.3rem}.nav-drop-menu.open{display:block}.nav-drop-menu a{font-size:0.95rem;padding:0.3rem 0}}

footer{text-align:center;padding:2rem;font-size:0.75rem;font-family:var(--font-mono);color:var(--cream-muted);border-top:1px solid var(--bg3)}
footer a{color:var(--cream-muted)}footer a:hover{color:var(--cream)}
.sig{font-family:var(--font-serif);font-style:italic;color:var(--leather-light);font-size:0.9rem}
</style>
<link rel="canonical" href="https://stockyard.dev/billing/cancel/">
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-BR9VHNFEEE"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-BR9VHNFEEE");gtag("config","AW-18046975504");
function toggleDrop(el){var m=el.parentElement.querySelector('.nav-drop-menu');m.classList.toggle('open')}
document.addEventListener('click',function(e){if(!e.target.closest('.nav-drop')){document.querySelectorAll('.nav-drop-menu').forEach(function(m){m.classList.remove('open')})}})
</script>
<meta property="og:image" content="https://stockyard.dev/site-assets/assets/marketing/og-card.png">
</head>
<body>
<div class="card">
<h1>Checkout Cancelled</h1>
<p>No charges were made. The Community tier remains active with full proxy access and 76 middleware modules.</p>
<div class="buttons">
<a href="/pricing/" class="cta">View Plans</a>
<a href="/ui" class="cta secondary">Back to Console</a>
</div>
</div>
<script>(function(){var p=new URLSearchParams(window.location.search);var r=p.get("ref");if(r)fetch("/api/affiliate/track?code="+encodeURIComponent(r)+"&page="+encodeURIComponent(window.location.pathname))})()</script>
</body>
</html>
