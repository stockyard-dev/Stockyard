<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SaaS Replacement Calculator — Stockyard</title>
<meta name="description" content="Calculate how much you save by replacing SaaS subscriptions with self-hosted Stockyard tools.">
<link rel="canonical" href="https://stockyard.dev/calculator/">
<style>
:root{--bg:#1a1410;--bg2:#241e18;--bg3:#2e261e;--rust:#c45d2c;--rl:#e8753a;--leather:#a0845c;--cream:#f0e6d3;--cd:#bfb5a3;--cm:#7a7060;--gold:#d4a843;--green:#4a9e5c;--mono:'JetBrains Mono',Consolas,monospace;--serif:'Libre Baskerville',Georgia,serif}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--cream);font-family:var(--serif);line-height:1.7}a{color:var(--rl);text-decoration:none}a:hover{color:var(--gold)}.wrap{max-width:820px;margin:0 auto;padding:2rem}h1{font-size:clamp(1.6rem,4vw,2.2rem);margin-bottom:.5rem;text-align:center}.sub{color:var(--cd);font-style:italic;text-align:center;margin-bottom:2rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.6rem;margin-bottom:2rem}.card{background:var(--bg2);border:2px solid var(--bg3);padding:.8rem;cursor:pointer;transition:border-color .15s;user-select:none}.card:hover{border-color:var(--leather)}.card.selected{border-color:var(--rl);background:#2a1e14}.card-name{font-family:var(--mono);font-size:.85rem;font-weight:bold;margin-bottom:.2rem}.card-price{font-size:.75rem;color:var(--cm)}.card-replace{font-size:.7rem;color:var(--leather);margin-top:.3rem}.results{background:var(--bg2);border:1px solid var(--bg3);padding:1.5rem;margin-bottom:2rem;display:none}.results.show{display:block}.totals{display:flex;justify-content:space-around;text-align:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem}.total-box h3{font-family:var(--mono);font-size:.6rem;letter-spacing:2px;text-transform:uppercase;color:var(--cm);margin-bottom:.3rem}.total-saas{font-size:1.8rem;color:var(--rust);font-family:var(--mono)}.total-sy{font-size:1.8rem;color:var(--green);font-family:var(--mono)}.total-save{font-size:1.8rem;color:var(--gold);font-family:var(--mono)}.rep-item{display:flex;justify-content:space-between;align-items:center;padding:.4rem 0;border-bottom:1px solid var(--bg3);font-family:var(--mono);font-size:.78rem}.rep-old{color:var(--cm);text-decoration:line-through}.rep-new{color:var(--green)}.rep-arrow{color:var(--leather)}.install-cmd{background:var(--bg);border:1px solid var(--bg3);padding:1rem;font-family:var(--mono);font-size:.8rem;color:var(--cream);margin-top:1rem;overflow-x:auto;white-space:pre;cursor:pointer}.install-cmd:hover{border-color:var(--leather)}.seats{display:flex;align-items:center;gap:.5rem;justify-content:center;margin-bottom:1.5rem}.seats label{font-family:var(--mono);font-size:.75rem;color:var(--cd)}.seats input{background:var(--bg2);border:1px solid var(--bg3);color:var(--cream);padding:.3rem .5rem;width:60px;font-family:var(--mono);font-size:.85rem;text-align:center}.note{font-size:.7rem;color:var(--cm);text-align:center;margin-top:1rem}
</style>
</head>
<body>
<div class="wrap">
<div style="font-family:var(--mono);font-size:.7rem;letter-spacing:4px;text-transform:uppercase;color:var(--leather);margin-bottom:1.5rem;text-align:center">Calculator</div>
<h1>How much is your SaaS stack costing you?</h1>
<p class="sub">Select the tools you currently pay for.</p>
<div class="seats"><label>Team size:</label><input type="number" id="seats" value="5" min="1" max="500" onchange="recalc()"><label>people</label></div>
<div class="grid" id="grid"></div>
<div class="results" id="results">
<div class="totals">
<div class="total-box"><h3>Current SaaS cost</h3><div class="total-saas" id="t-saas">$0</div><div style="font-size:.65rem;color:var(--cm)">per month</div></div>
<div class="total-box"><h3>Stockyard cost</h3><div class="total-sy" id="t-sy">$0</div><div style="font-size:.65rem;color:var(--cm)">per month</div></div>
<div class="total-box"><h3>You save</h3><div class="total-save" id="t-save">$0</div><div style="font-size:.65rem;color:var(--cm)">per month</div></div>
</div>
<div id="reps"></div>
<div class="install-cmd" id="cmd" onclick="copyCmd()" title="Click to copy"></div>
<div class="note">Click the command to copy it.</div>
</div>
<div style="text-align:center;margin-top:2rem;font-family:var(--mono);font-size:.8rem">
<a href="/tools/">All 150 tools</a> &middot; <a href="/complete/">Complete $29/mo</a> &middot; <a href="/">Home</a>
</div>
</div>
<script>
const T=[
{n:"Sentry",p:26,s:false,r:"Seismograph",k:"seismograph",y:.99,d:"Error tracking"},
{n:"LaunchDarkly",p:10,s:true,r:"Salt Lick",k:"saltlick",y:.99,d:"Feature flags"},
{n:"Statuspage",p:79,s:false,r:"Paddock",k:"paddock",y:.99,d:"Status page"},
{n:"Mixpanel",p:20,s:false,r:"Headcount",k:"headcount",y:1.99,d:"Analytics"},
{n:"Bitly",p:35,s:false,r:"Lasso",k:"lasso",y:.99,d:"Link shortener"},
{n:"FreshBooks",p:15,s:false,r:"Billfold",k:"billfold",y:.99,d:"Invoicing"},
{n:"Postman",p:14,s:true,r:"Assay",k:"assay",y:.99,d:"API testing"},
{n:"Toggl",p:10,s:true,r:"Sundial",k:"sundial",y:.99,d:"Time tracking"},
{n:"Notion",p:8,s:true,r:"Handbook",k:"handbook",y:.99,d:"Internal wiki"},
{n:"Linear",p:8,s:true,r:"Bounty",k:"bounty",y:.99,d:"Issue tracking"},
{n:"PagerDuty",p:21,s:true,r:"Sentinel",k:"sentinel",y:.99,d:"Alerting"},
{n:"UptimeRobot",p:7,s:false,r:"Bellwether",k:"bellwether",y:.99,d:"Uptime monitoring"},
{n:"Hookdeck",p:25,s:false,r:"Corral",k:"corral",y:.99,d:"Webhook testing"},
{n:"Expensify",p:5,s:true,r:"Steward",k:"steward",y:.99,d:"Expenses"},
{n:"Trello",p:5,s:true,r:"Prairie",k:"prairie",y:.99,d:"Kanban boards"},
{n:"Canny",p:79,s:false,r:"Podium",k:"podium",y:.99,d:"Feedback"},
{n:"Datadog",p:15,s:false,r:"Outpost",k:"outpost",y:.99,d:"Monitoring"},
{n:"HashiCorp Vault",p:0,s:false,r:"Strongbox",k:"strongbox",y:.99,d:"Secrets",x:"Complex self-host"},
{n:"Buffer",p:5,s:false,r:"Pasture",k:"pasture",y:.99,d:"Social scheduling"},
{n:"HubSpot CRM",p:0,s:false,r:"Dossier",k:"dossier",y:.99,d:"CRM",x:"Free but cloud-only"},
];
let sel=new Set();const g=document.getElementById("grid");
T.forEach((t,i)=>{const c=document.createElement("div");c.className="card";const pr=t.s?"$"+t.p+"/user/mo":(t.p?"$"+t.p+"/mo":(t.x||"Free"));c.innerHTML='<div class="card-name">'+t.n+'</div><div class="card-price">'+pr+'</div><div class="card-replace">'+t.d+" \u2192 "+t.r+"</div>";c.onclick=()=>{if(sel.has(i)){sel.delete(i);c.classList.remove("selected")}else{sel.add(i);c.classList.add("selected")}recalc()};g.appendChild(c)});
function recalc(){const seats=parseInt(document.getElementById("seats").value)||5;const res=document.getElementById("results");if(!sel.size){res.classList.remove("show");return}res.classList.add("show");let ts=0,ty=0;const items=[],slugs=[];sel.forEach(i=>{const t=T[i];const saas=t.s?t.p*seats:t.p;ts+=saas;ty+=t.y;items.push({o:t.n,op:saas,n:t.r,np:t.y,k:t.k});slugs.push(t.k)});const bundle=ty>29;const syTotal=bundle?29:ty;document.getElementById("t-saas").textContent="$"+ts;document.getElementById("t-sy").textContent="$"+(bundle?"29":ty.toFixed(2));document.getElementById("t-save").textContent="$"+(ts-syTotal).toFixed(0)+"/mo";let h=items.map(it=>'<div class="rep-item"><span class="rep-old">'+it.o+" $"+it.op+'/mo</span><span class="rep-arrow">\u2192</span><span class="rep-new">'+it.n+" $"+it.np+"/mo</span></div>").join("");if(bundle)h+='<div style="padding:.8rem 0;color:var(--gold);font-family:var(--mono);font-size:.75rem">Complete bundle caps at $29/mo for all 150 tools</div>';document.getElementById("reps").innerHTML=h;document.getElementById("cmd").textContent=slugs.length<=3?slugs.map(s=>"curl -fsSL stockyard.dev/"+s+"/install.sh | sh").join("\n"):"curl -fsSL stockyard.dev/install-tools.sh | sh -s -- "+slugs.join(" ")}
function copyCmd(){navigator.clipboard.writeText(document.getElementById("cmd").textContent).then(()=>{const e=document.getElementById("cmd");e.style.borderColor="#4a9e5c";setTimeout(()=>e.style.borderColor="",1000)})}
</script>
</body>
</html>
