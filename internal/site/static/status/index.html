<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Status — Stockyard</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{--bg:#1a1410;--bg2:#241e18;--bg3:#2e261e;--rust:#c45d2c;--cream:#f0e6d3;--cd:#bfb5a3;--cm:#7a7060;--green:#4a9e5c;--red:#c45d2c;--mono:'JetBrains Mono',Consolas,monospace;--serif:'Libre Baskerville',Georgia,serif}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--cream);font-family:var(--serif);line-height:1.7}
.wrap{max-width:600px;margin:0 auto;padding:2rem}
h1{font-size:1.5rem;text-align:center;margin-bottom:.5rem}
.sub{text-align:center;color:var(--cd);font-style:italic;margin-bottom:2rem;font-size:.9rem}
.svc{background:var(--bg2);border:1px solid var(--bg3);padding:.8rem 1rem;margin-bottom:.4rem;display:flex;justify-content:space-between;align-items:center}
.svc-name{font-family:var(--mono);font-size:.85rem}
.svc-status{font-family:var(--mono);font-size:.7rem;padding:.2rem .5rem;border-radius:2px}
.up{background:#1a3a1a;color:var(--green)}.down{background:#3a1a1a;color:var(--red)}.checking{background:var(--bg3);color:var(--cm)}
.ts{text-align:center;color:var(--cm);font-size:.7rem;font-family:var(--mono);margin-top:1.5rem}
</style>
</head>
<body>
<div class="wrap">
<h1>System Status</h1>
<p class="sub">Real-time health checks</p>
<div id="services">
<div class="svc"><span class="svc-name">Website</span><span class="svc-status checking" id="s-site">checking...</span></div>
<div class="svc"><span class="svc-name">API / Health</span><span class="svc-status checking" id="s-api">checking...</span></div>
<div class="svc"><span class="svc-name">Install Script</span><span class="svc-status checking" id="s-install">checking...</span></div>
<div class="svc"><span class="svc-name">GitHub Releases</span><span class="svc-status checking" id="s-gh">checking...</span></div>
<div class="svc"><span class="svc-name">Docker Image</span><span class="svc-status checking" id="s-docker">checking...</span></div>
</div>
<div class="ts" id="ts"></div>
</div>
<script>
async function check(id, url, validate) {
  const el = document.getElementById(id);
  try {
    const r = await fetch(url, {mode:'cors',cache:'no-store'});
    if (validate ? await validate(r) : r.ok) {
      el.textContent = 'operational';
      el.className = 'svc-status up';
    } else {
      el.textContent = 'degraded';
      el.className = 'svc-status down';
    }
  } catch(e) {
    el.textContent = 'unreachable';
    el.className = 'svc-status down';
  }
}

check('s-site', '/', r => r.ok);
check('s-api', '/api/health', async r => { const d = await r.json(); return d.status === 'ok'; });
check('s-install', '/install.sh', r => r.ok && r.headers.get('content-type')?.includes('text'));
check('s-gh', 'https://api.github.com/repos/stockyard-dev/Stockyard/releases/tags/v1.1.0', r => r.ok);
check('s-docker', 'https://ghcr.io/v2/stockyard-dev/stockyard/tags/list', r => true); // CORS blocks but existence check

document.getElementById('ts').textContent = 'Last checked: ' + new Date().toISOString().slice(0,19) + ' UTC';
</script>
<script>(function(){var p=new URLSearchParams(window.location.search);var r=p.get("ref");if(r)fetch("/api/affiliate/track?code="+encodeURIComponent(r)+"&page="+encodeURIComponent(window.location.pathname))})()</script>
</body>
</html>
