name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download dependencies
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Build core
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${VERSION}" -o stockyard ./cmd/stockyard/

      - name: Build OSS proxy
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o stockyard-proxy ./cmd/stockyard-proxy/

      - name: Build all sub-products
        run: |
          total=0
          failed=0
          for dir in cmd/*/; do
            p=$(basename "$dir")
            # Skip core binaries (already built above)
            [ "$p" = "stockyard" ] && continue
            [ "$p" = "stockyard-proxy" ] && continue
            CGO_ENABLED=0 go build -ldflags="-s -w" -o /dev/null "./$dir" 2>/dev/null && total=$((total+1)) || { echo "  FAIL: $p"; failed=$((failed+1)); }
          done
          echo "Built $total sub-products ($failed failures)"
          [ "$failed" -gt 0 ] && exit 1 || true

      - name: Test with coverage
        run: |
          go test ./... -count=1 -timeout 120s -coverprofile=coverage.out -covermode=atomic 2>&1 | tee test-output.txt
          echo ""
          echo "--- Coverage Summary ---"
          go tool cover -func=coverage.out | tail -1

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

      - name: Race detection (sub-products)
        run: go test ./internal/bid/... ./internal/doubt/... ./internal/fault/... ./internal/replay/... ./internal/stampede/... -race -count=1 -timeout 120s

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./... 2>&1 | head -50 || true

  bench:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run benchmarks
        run: |
          go test ./internal/proxy/ -bench=. -benchmem -count=3 -timeout 120s | tee bench.txt
          echo "--- Summary ---"
          grep "^Benchmark" bench.txt | head -20

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench.txt

  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Run smoke tests
        run: bash test/smoke_test.sh

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t stockyard:latest -f Dockerfile.manual .

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Smoke test
        run: |
          docker run -d --name sy-test -p 7749:7749 stockyard:latest
          sleep 5
          curl -sf http://localhost:7749/health | jq -e '.status == "ok" or .status == "degraded"'
          docker stop sy-test
