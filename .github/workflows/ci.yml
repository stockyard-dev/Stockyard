name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download dependencies
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Build core
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o stockyard ./cmd/stockyard/

      - name: Build all sub-products
        run: |
          for p in bid doubt echo fault fossil grain hollow iron morph prism replay seance spine stampede tide trailhead verdikt; do
            CGO_ENABLED=0 go build -ldflags="-s -w" -o /dev/null ./cmd/$p && echo "  $p: ok" || { echo "  $p: FAILED"; exit 1; }
          done

      - name: Test with coverage
        run: |
          go test ./... -count=1 -timeout 120s -coverprofile=coverage.out -covermode=atomic 2>&1 | tee test-output.txt
          echo ""
          echo "--- Coverage Summary ---"
          go tool cover -func=coverage.out | tail -1

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

      - name: Race detection (sub-products)
        run: go test ./internal/bid/... ./internal/doubt/... ./internal/fault/... ./internal/replay/... ./internal/stampede/... -race -count=1 -timeout 120s

      - name: Vet
        run: go vet ./...

  bench:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run benchmarks
        run: |
          go test ./internal/proxy/ -bench=. -benchmem -count=3 -timeout 120s | tee bench.txt
          echo "--- Summary ---"
          grep "^Benchmark" bench.txt | head -20

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench.txt

  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Run smoke tests
        run: bash test/smoke_test.sh

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t stockyard:latest -f Dockerfile.manual .

      - name: Smoke test
        run: |
          docker run -d --name sy-test -p 4200:4200 stockyard:latest
          sleep 5
          curl -sf http://localhost:4200/health | grep '"status":"ok"'
          docker stop sy-test
