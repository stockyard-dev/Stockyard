<text x="32" y="130" fill="#f0e6d3" font-size="22" font-family="Libre Baskerville,Georgia,serif" font-weight="bold">Stockyard launches 164 self-hosted tools</text>
<text x="32" y="152" fill="#a0845c" font-size="10" font-family="JetBrains Mono,monospace">draft press release · embargoed until Oct 1</text>
<line x1="32" y1="170" x2="688" y2="170" stroke="#2e261e" stroke-width="1"/>
<text x="32" y="204" fill="#bfb5a3" font-size="11" font-family="Libre Baskerville,Georgia,serif">OAKLAND, CA — Stockyard today announced the general availability of</text>
<text x="32" y="222" fill="#bfb5a3" font-size="11" font-family="Libre Baskerville,Georgia,serif">164 self-hosted developer and small-business tools, all distributed as</text>
<text x="32" y="240" fill="#bfb5a3" font-size="11" font-family="Libre Baskerville,Georgia,serif">a single Go binary with embedded SQLite and zero external dependencies.</text>
<text x="32" y="266" fill="#bfb5a3" font-size="11" font-family="Libre Baskerville,Georgia,serif">The platform replaces dozens of common SaaS subscriptions with software</text>
<text x="32" y="284" fill="#bfb5a3" font-size="11" font-family="Libre Baskerville,Georgia,serif">that runs entirely on the customer&#x27;s own hardware, with no cloud</text>
<text x="32" y="302" fill="#bfb5a3" font-size="11" font-family="Libre Baskerville,Georgia,serif">connectivity required and no recurring vendor lock-in.</text>
<text x="32" y="448" fill="#a0845c" font-size="9" font-family="JetBrains Mono,monospace" letter-spacing="2">TAGS</text>
