<text x="626" y="25" text-anchor="middle" fill="#e8753a" font-size="9" font-family="JetBrains Mono,monospace" letter-spacing="1">RUNNING</text>
<text x="20" y="64" fill="#7a7060" font-size="12" font-family="JetBrains Mono,monospace">$ </text><text x="36" y="64" fill="#f0e6d3" font-size="12" font-family="JetBrains Mono,monospace">BRAND_ADMIN_KEY=secret brand</text><text x="20" y="104" fill="#e8753a" font-size="12" font-family="JetBrains Mono,monospace">  Stockyard Brand v0.1.0</text><text x="20" y="124" fill="#c4a87a" font-size="12" font-family="JetBrains Mono,monospace">  Ingest:  POST http://localhost:8750/api/events</text><text x="20" y="144" fill="#c4a87a" font-size="12" font-family="JetBrains Mono,monospace">  Verify:  GET  http://localhost:8750/api/verify</text><text x="20" y="164" fill="#5ba86e" font-size="12" font-family="JetBrains Mono,monospace">  License: Pro (you@example.com)</text><line x1="20" y1="200" x2="660" y2="200" stroke="#2e261e" stroke-width="1"/><text x="20" y="244" fill="#7a7060" font-size="12" font-family="JetBrains Mono,monospace">$ </text><text x="36" y="244" fill="#f0e6d3" font-size="12" font-family="JetBrains Mono,monospace">curl -s -X POST localhost:8750/api/events \</text><text x="20" y="264" fill="#7a7060" font-size="12" font-family="JetBrains Mono,monospace">$ </text><text x="36" y="264" fill="#f0e6d3" font-size="12" font-family="JetBrains Mono,monospace">  -d '{"type":"user_login","actor":"alice","detail":{"ip":"1.2.3.4"}}'</text><text x="20" y="284" fill="#d4a843" font-size="12" font-family="JetBrains Mono,monospace">→ {"entry":{"seq":42,"entry_hash":"a3f8c2..."}}</text><text x="20" y="324" fill="#7a7060" font-size="12" font-family="JetBrains Mono,monospace"># Verify the entire chain in one call</text><text x="20" y="344" fill="#7a7060" font-size="12" font-family="JetBrains Mono,monospace">$ </text><text x="36" y="344" fill="#f0e6d3" font-size="12" font-family="JetBrains Mono,monospace">curl -s localhost:8750/api/verify -H "Authorization: Bearer secret"</text><text x="20" y="364" fill="#5ba86e" font-size="12" font-family="JetBrains Mono,monospace">→ {"valid":true,"checked":42,"message":"chain intact — 42 entries verified"}</text><text x="20" y="404" fill="#7a7060" font-size="12" font-family="JetBrains Mono,monospace"># Export evidence pack for SOC2 audit</text><text x="20" y="424" fill="#7a7060" font-size="12" font-family="JetBrains Mono,monospace">$ </text><text x="36" y="424" fill="#f0e6d3" font-size="12" font-family="JetBrains Mono,monospace">curl -s "localhost:8750/api/evidence/export?from=2026-01-01" &gt; evidence.json</text><text x="20" y="444" fill="#5ba86e" font-size="12" font-family="JetBrains Mono,monospace">→ evidence.json written (42 entries, chain_valid: true, signed: true)</text>
