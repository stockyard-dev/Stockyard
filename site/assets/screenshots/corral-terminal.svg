<svg xmlns="http://www.w3.org/2000/svg" width="680" height="524" viewBox="0 0 680 524" role="img" aria-label="corral — webhook inbox terminal output">
<rect width="680" height="524" rx="8" fill="#1a1410"/>
<rect width="680" height="44" rx="8" fill="#241e18"/>
<rect y="43" width="680" height="2" fill="#2e261e"/>
<circle cx="18" cy="22" r="5" fill="#c0392b"/>
<circle cx="36" cy="22" r="5" fill="#d4a843"/>
<circle cx="54" cy="22" r="5" fill="#5ba86e"/>
<text x="340" y="26" text-anchor="middle" fill="#a0845c" font-size="11" font-family="JetBrains Mono,monospace">corral — webhook inbox</text>
<rect x="590" y="13" width="72" height="18" rx="3" fill="none" stroke="#e8753a" stroke-width="1"/>
<text x="626" y="25" text-anchor="middle" fill="#e8753a" font-size="9" font-family="JetBrains Mono,monospace" letter-spacing="1">RUNNING</text>
<text x="20" y="64" fill="#7a7060" font-size="12" font-family="JetBrains Mono,monospace">$ </text><text x="36" y="64" fill="#f0e6d3" font-size="12" font-family="JetBrains Mono,monospace">DATA_DIR=./data corral</text><text x="20" y="104" fill="#e8753a" font-size="12" font-family="JetBrains Mono,monospace">  Stockyard Corral v0.1.0</text><text x="20" y="124" fill="#c4a87a" font-size="12" font-family="JetBrains Mono,monospace">  Webhook relay:  http://localhost:8760/hook/{endpoint_id}</text><text x="20" y="144" fill="#c4a87a" font-size="12" font-family="JetBrains Mono,monospace">  API:            http://localhost:8760/api</text><text x="20" y="164" fill="#c4a87a" font-size="12" font-family="JetBrains Mono,monospace">  Dashboard:      http://localhost:8760/ui</text><text x="20" y="184" fill="#5ba86e" font-size="12" font-family="JetBrains Mono,monospace">  License:        Pro (you@example.com)</text><line x1="20" y1="220" x2="660" y2="220" stroke="#2e261e" stroke-width="1"/><text x="20" y="264" fill="#7a7060" font-size="12" font-family="JetBrains Mono,monospace">$ </text><text x="36" y="264" fill="#f0e6d3" font-size="12" font-family="JetBrains Mono,monospace">curl -s -X POST localhost:8760/api/endpoints -d '{"name":"stripe"}'</text><text x="20" y="284" fill="#d4a843" font-size="12" font-family="JetBrains Mono,monospace">→ hook_url: http://localhost:8760/hook/ep_a1b2c3d4</text><text x="20" y="324" fill="#7a7060" font-size="12" font-family="JetBrains Mono,monospace"># Point Stripe at that URL. Every hit is captured:</text><text x="20" y="364" fill="#5ba86e" font-size="12" font-family="JetBrains Mono,monospace">[corral] evt_f8e2 POST /hook/ep_a1b2c3 (1.2KB) from 54.187.x.x</text><text x="20" y="384" fill="#5ba86e" font-size="12" font-family="JetBrains Mono,monospace">[corral] evt_9c41 POST /hook/ep_a1b2c3 (892B)  from 54.187.x.x</text><text x="20" y="404" fill="#5ba86e" font-size="12" font-family="JetBrains Mono,monospace">[corral] evt_3da7 POST /hook/ep_a1b2c3 (1.4KB) from 54.187.x.x</text><text x="20" y="444" fill="#7a7060" font-size="12" font-family="JetBrains Mono,monospace">$ </text><text x="36" y="444" fill="#f0e6d3" font-size="12" font-family="JetBrains Mono,monospace">curl -s -X POST localhost:8760/api/events/evt_f8e2/replay \</text><text x="20" y="464" fill="#7a7060" font-size="12" font-family="JetBrains Mono,monospace">$ </text><text x="36" y="464" fill="#f0e6d3" font-size="12" font-family="JetBrains Mono,monospace">  -d '{"target":"http://localhost:3000/webhook"}'</text><text x="20" y="484" fill="#d4a843" font-size="12" font-family="JetBrains Mono,monospace">→ {"status_code":200,"latency_ms":12}</text>
</svg>