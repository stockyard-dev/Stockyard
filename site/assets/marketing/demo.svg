<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="'JetBrains Mono','Cascadia Code','SF Mono','Menlo',monospace" font-size="13">
  <style>
    .bg { fill: #1a1410; }
    .bar { fill: #241e18; }
    .dot1 { fill: #c45d2c; }
    .dot2 { fill: #d4a843; }
    .dot3 { fill: #5ba86e; }
    .prompt { fill: #a0845c; }
    .cmd { fill: #f0e6d3; }
    .comment { fill: #5a5040; }
    .output { fill: #bfb5a3; }
    .accent { fill: #c45d2c; }
    .green { fill: #5ba86e; }
    .gold { fill: #d4a843; }
    .header { fill: #a0845c; font-size: 11px; }

    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
    .l1  { opacity: 0; animation: appear 0.01s 0.5s forwards; }
    .l2  { opacity: 0; animation: appear 0.01s 1.2s forwards; }
    .l3  { opacity: 0; animation: appear 0.01s 1.4s forwards; }
    .l4  { opacity: 0; animation: appear 0.01s 1.6s forwards; }
    .l5  { opacity: 0; animation: appear 0.01s 2.5s forwards; }
    .l6  { opacity: 0; animation: appear 0.01s 3.5s forwards; }
    .l7  { opacity: 0; animation: appear 0.01s 3.7s forwards; }
    .l8  { opacity: 0; animation: appear 0.01s 3.9s forwards; }
    .l9  { opacity: 0; animation: appear 0.01s 4.1s forwards; }
    .l10 { opacity: 0; animation: appear 0.01s 4.3s forwards; }
    .l11 { opacity: 0; animation: appear 0.01s 5.5s forwards; }
    .l12 { opacity: 0; animation: appear 0.01s 6.5s forwards; }
    .l13 { opacity: 0; animation: appear 0.01s 6.7s forwards; }
    .l14 { opacity: 0; animation: appear 0.01s 6.9s forwards; }
    .l15 { opacity: 0; animation: appear 0.01s 7.1s forwards; }
    .l16 { opacity: 0; animation: appear 0.01s 7.3s forwards; }
    .l17 { opacity: 0; animation: appear 0.01s 7.5s forwards; }
    .l18 { opacity: 0; animation: appear 0.01s 7.7s forwards; }

    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .cursor { animation: blink 1s infinite; fill: #f0e6d3; }
  </style>

  <!-- Window -->
  <rect class="bg" width="820" height="520" rx="8"/>
  <rect class="bar" width="820" height="32" rx="8"/>
  <rect class="bg" y="24" width="820" height="8"/>
  <circle class="dot1" cx="20" cy="16" r="6"/>
  <circle class="dot2" cx="40" cy="16" r="6"/>
  <circle class="dot3" cx="60" cy="16" r="6"/>
  <text class="header" x="410" y="20" text-anchor="middle">stockyard — 66 modules, one binary</text>

  <!-- Line 1: Install command -->
  <g class="l1">
    <text class="prompt" x="20" y="62">$</text>
    <text class="cmd" x="35" y="62">curl -sSL stockyard.dev/install.sh | sh</text>
  </g>

  <!-- Line 2-4: Install output -->
  <g class="l2"><text class="green" x="20" y="82">▸ Detected linux/amd64</text></g>
  <g class="l3"><text class="green" x="20" y="102">▸ Installing stockyard v1.0.0</text></g>
  <g class="l4"><text class="green" x="20" y="122">▸ Installed to /usr/local/bin/stockyard</text></g>

  <!-- Line 5: Start command -->
  <g class="l5">
    <text class="prompt" x="20" y="158">$</text>
    <text class="cmd" x="35" y="158">stockyard</text>
  </g>

  <!-- Line 6-10: Boot output -->
  <g class="l6"><text class="output" x="20" y="178">Stockyard v1.0.0</text></g>
  <g class="l7">
    <text class="output" x="20" y="198">  Apps:     </text>
    <text class="gold" x="115" y="198">16 apps loaded</text>
  </g>
  <g class="l8">
    <text class="output" x="20" y="218">  Modules:  </text>
    <text class="gold" x="115" y="218">66 middleware modules (400ns chain)</text>
  </g>
  <g class="l9">
    <text class="output" x="20" y="238">  Proxy:    </text>
    <text class="accent" x="115" y="238">http://localhost:4200/v1</text>
  </g>
  <g class="l10">
    <text class="output" x="20" y="258">  Console:  </text>
    <text class="accent" x="115" y="258">http://localhost:4200/ui</text>
  </g>

  <!-- Line 11: Curl command -->
  <g class="l11">
    <text class="prompt" x="20" y="294">$</text>
    <text class="cmd" x="35" y="294">curl localhost:4200/v1/chat/completions -d '{"model":"gpt-4o-mini",...}'</text>
  </g>

  <!-- Line 12-18: Response with headers -->
  <g class="l12"><text class="comment" x="20" y="314"># Response flows through 66 modules in 400ns:</text></g>
  <g class="l13">
    <text class="output" x="20" y="334">x-stockyard-trace-id:  </text>
    <text class="gold" x="210" y="334">tr_6aa2647d1c6a</text>
  </g>
  <g class="l14">
    <text class="output" x="20" y="354">x-stockyard-cost:      </text>
    <text class="gold" x="210" y="354">$0.000120</text>
  </g>
  <g class="l15">
    <text class="output" x="20" y="374">x-stockyard-model:     </text>
    <text class="gold" x="210" y="374">gpt-4o-mini</text>
  </g>
  <g class="l16">
    <text class="output" x="20" y="394">x-stockyard-cached:    </text>
    <text class="gold" x="210" y="394">false</text>
  </g>
  <g class="l17">
    <text class="output" x="20" y="414">x-stockyard-tokens:    </text>
    <text class="gold" x="210" y="414">8 in / 10 out</text>
  </g>
  <g class="l18">
    <text class="output" x="20" y="434">x-stockyard-latency:   </text>
    <text class="gold" x="210" y="434">1,202ms</text>
  </g>

  <!-- Blinking cursor at end -->
  <g class="l18">
    <text class="prompt" x="20" y="470">$</text>
    <rect class="cursor" x="35" y="458" width="9" height="16" rx="1"/>
  </g>

  <!-- Watermark -->
  <text x="410" y="508" text-anchor="middle" font-size="10" fill="#3a3228">stockyard.dev — Replace your LLM middleware stack</text>
</svg>
