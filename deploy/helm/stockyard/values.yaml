# Default values for Stockyard Helm chart.

replicaCount: 1

image:
  repository: stockyard
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 4200

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: stockyard.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: stockyard-tls
  #    hosts:
  #      - stockyard.local

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

persistence:
  enabled: true
  storageClass: ""
  size: 5Gi
  accessModes:
    - ReadWriteOnce

env:
  PORT: "4200"
  DATA_DIR: /data
  LOG_LEVEL: info
  LOG_FORMAT: text

# Sensitive values — set via --set or external secret.
secrets:
  adminKey: ""
  openaiApiKey: ""
  anthropicApiKey: ""
  googleApiKey: ""
  groqApiKey: ""
  resendApiKey: ""

nodeSelector: {}
tolerations: []
affinity: {}
