# Default values for Stockyard Helm chart.

replicaCount: 1

image:
  repository: ghcr.io/stockyard-dev/stockyard
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 4200

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: stockyard.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: stockyard-tls
  #    hosts:
  #      - stockyard.local

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

persistence:
  enabled: true
  storageClass: ""
  size: 5Gi
  accessModes:
    - ReadWriteOnce

env:
  PORT: "4200"
  DATA_DIR: /data

# Provider API keys — set via --set or external secret.
# Only set the providers you use. Stockyard auto-detects on startup.
secrets:
  adminKey: ""
  # Major cloud
  openaiApiKey: ""
  anthropicApiKey: ""
  geminiApiKey: ""
  azureOpenaiApiKey: ""
  # Fast inference
  groqApiKey: ""
  cerebrasApiKey: ""
  sambanovaApiKey: ""
  fireworksApiKey: ""
  togetherApiKey: ""
  # Specialized
  mistralApiKey: ""
  deepseekApiKey: ""
  cohereApiKey: ""
  xaiApiKey: ""
  perplexityApiKey: ""
  # Open model hosts
  deepinfraApiKey: ""
  nvidiaApiKey: ""
  hfToken: ""
  replicateApiToken: ""
  openrouterApiKey: ""

nodeSelector: {}
tolerations: []
affinity: {}
