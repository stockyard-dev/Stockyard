apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  labels:
    app: stockyard
    release: {{ .Release.Name }}
type: Opaque
stringData:
  {{- if .Values.secrets.adminKey }}
  STOCKYARD_ADMIN_KEY: {{ .Values.secrets.adminKey | quote }}
  {{- end }}
  {{- if .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.geminiApiKey }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.azureOpenaiApiKey }}
  AZURE_OPENAI_API_KEY: {{ .Values.secrets.azureOpenaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.groqApiKey }}
  GROQ_API_KEY: {{ .Values.secrets.groqApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.cerebrasApiKey }}
  CEREBRAS_API_KEY: {{ .Values.secrets.cerebrasApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.sambanovaApiKey }}
  SAMBANOVA_API_KEY: {{ .Values.secrets.sambanovaApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.fireworksApiKey }}
  FIREWORKS_API_KEY: {{ .Values.secrets.fireworksApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.togetherApiKey }}
  TOGETHER_API_KEY: {{ .Values.secrets.togetherApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.mistralApiKey }}
  MISTRAL_API_KEY: {{ .Values.secrets.mistralApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.deepseekApiKey }}
  DEEPSEEK_API_KEY: {{ .Values.secrets.deepseekApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.cohereApiKey }}
  COHERE_API_KEY: {{ .Values.secrets.cohereApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.xaiApiKey }}
  XAI_API_KEY: {{ .Values.secrets.xaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.perplexityApiKey }}
  PERPLEXITY_API_KEY: {{ .Values.secrets.perplexityApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.deepinfraApiKey }}
  DEEPINFRA_API_KEY: {{ .Values.secrets.deepinfraApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.nvidiaApiKey }}
  NVIDIA_API_KEY: {{ .Values.secrets.nvidiaApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.hfToken }}
  HF_TOKEN: {{ .Values.secrets.hfToken | quote }}
  {{- end }}
  {{- if .Values.secrets.replicateApiToken }}
  REPLICATE_API_TOKEN: {{ .Values.secrets.replicateApiToken | quote }}
  {{- end }}
  {{- if .Values.secrets.openrouterApiKey }}
  OPENROUTER_API_KEY: {{ .Values.secrets.openrouterApiKey | quote }}
  {{- end }}
