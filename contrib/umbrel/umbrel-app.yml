description: >-
  Stockyard is a collection of 150 self-hosted developer tools. Bug tracker, CRM,
  feature flags, uptime monitoring, invoicing, webhook testing, secret management,
  analytics, and more. Each tool runs as a single Go binary with embedded SQLite.
  No external dependencies required.
  
  The platform also includes an LLM proxy with 76 middleware modules, 16 providers,
  cost tracking, caching, and safety filters.
