name: stockyard
services:
  stockyard:
    image: ghcr.io/stockyard-dev/stockyard:latest
    restart: unless-stopped
    ports:
      - target: 4200
        published: "4200"
        protocol: tcp
    environment:
      - PORT=4200
      - DATA_DIR=/data
    volumes:
      - type: bind
        source: /DATA/AppData/stockyard
        target: /data
    x-casaos:
      envs:
        - container: PORT
          description:
            en_us: HTTP port
        - container: DATA_DIR
          description:
            en_us: Data directory
      ports:
        - container: "4200"
          description:
            en_us: Web UI
      volumes:
        - container: /data
          description:
            en_us: Data storage

x-casaos:
  architectures:
    - amd64
    - arm64
  main: stockyard
  author: stockyard-dev
  category: Developer
  description:
    en_us: 150 self-hosted developer tools in one binary. Bug tracker, CRM, feature flags, uptime monitoring, invoicing, webhook testing, secret management, analytics, LLM proxy, and more. Single binary, embedded SQLite, zero dependencies.
  developer: Stockyard
  icon: https://stockyard.dev/site-assets/assets/brand/apple-touch-icon.png
  tagline:
    en_us: 150 self-hosted developer tools, one binary
  title:
    en_us: Stockyard
  index: /ui
  port_map: "4200"
  scheme: http
