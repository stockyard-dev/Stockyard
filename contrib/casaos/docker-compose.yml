name: stockyard
services:
  stockyard:
    image: ghcr.io/stockyard-dev/stockyard:latest
    container_name: stockyard
    ports:
      - target: 4200
        published: "4200"
        protocol: tcp
    environment:
      PORT: "4200"
      DATA_DIR: /data
    volumes:
      - type: bind
        source: /DATA/AppData/stockyard
        target: /data
    restart: unless-stopped

x-casaos:
  architectures:
    - amd64
    - arm64
  author: stockyard-dev
  category: Developer
  description:
    en_us: 150 self-hosted developer tools. Bug tracker, CRM, feature flags, analytics, invoicing, and 145 more. Single binary, embedded SQLite, zero dependencies.
  developer: Stockyard
  icon: https://stockyard.dev/site-assets/assets/brand/favicon-32.png
  index: /ui
  main: stockyard
  port_map: "4200"
  scheme: http
  store_app_id: stockyard
  title:
    en_us: Stockyard
  tips:
    before_install:
      en_us: Dashboard at http://YOUR_IP:4200/ui. All 150 tools included.
