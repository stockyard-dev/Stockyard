version: "3.8"

services:
  stockyard:
    image: ghcr.io/stockyard-dev/stockyard:latest
    restart: unless-stopped
    environment:
      - PORT=4200
      - DATA_DIR=/data
    volumes:
      - stockyard-data:/data
    labels:
      - "coolify.managed=true"
      - "coolify.name=Stockyard"
      - "coolify.description=150 self-hosted developer tools in one binary"

volumes:
  stockyard-data:
