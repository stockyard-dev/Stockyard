name: Aggressive Caching
slug: cache-aggressive
author: Community
description: "Maximum cache hit rate: exact + semantic cache with 0.80 threshold, 2h TTL"
tags: [caching, cost, community]

modules:
  - name: cache
    enabled: true
    config:
      ttl: 7200
      max_entries: 50000
  - name: semanticcache
    enabled: true
    config:
      threshold: 0.80
      max_items: 20000
      ttl: 7200
